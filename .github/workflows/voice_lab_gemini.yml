# Voice lab: Gemini TTS only (free tier), committed to this branch.
name: Voice lab Gemini
on:
  push:
    branches: [voice-lab]
    paths: ['voice_lab/gen_gemini_tts.py', '.github/workflows/voice_lab_gemini.yml']
permissions:
  contents: write
jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: python voice_lab/gen_gemini_tts.py voice_lab/samples
      - run: |
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add voice_lab/samples
          git commit -m "voice lab gemini tts" && git push origin HEAD:voice-lab
  heard:
    needs: gemini
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: voice-lab }
      - run: |
          pip install -q faster-whisper==1.1.1
          python - <<'PY'
          from faster_whisper import WhisperModel
          import glob
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("voice_lab/samples/gemini_*.mp3")):
              segs, _ = m.transcribe(f)
              print("==", f); [print(f"{s.start:6.1f} {s.text}") for s in segs]
          PY
