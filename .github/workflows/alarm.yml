name: Daily alarm (did today actually work?)

# THE ONLY WORKFLOW ALLOWED TO BE LOUD.
#
# Every failure this pipeline has had was silent — three days with zero videos
# (2026-07-26..28), Phase B applying a two-day-old bundle and exiting green
# (2026-08-01), 21 hashtags per upload that YouTube discarded wholesale for the
# channel's entire life. Not one turned a check red, because every workflow
# reports on the STEPS it ran and none report on the OUTCOME they produced.
#
# This runs last, checks outcomes against config/channel_registry.json, and
# comments on the tracking issue ONLY when something is wrong. A daily
# "all good" comment is how people stop reading the alarm.

on:
  schedule:
    # 01:15 UTC — 20:15 Central in summer, 19:15 in winter. After the last
    # publish slot (15:30 Central) plus render time in both DST halves, and
    # after retro.yml at 23:15 UTC so the day is fully settled.
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Production date to judge (YYYYMMDD, default yesterday)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write     # the alarm comment, and only that

env:
  PYTHON_VERSION: '3.11'
  REPORT_ISSUE_NUMBER: ${{ vars.REPORT_ISSUE_NUMBER || '1' }}

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Judge the day
        id: judge
        run: |
          set +e
          D="${{ inputs.date }}"
          ARGS="--markdown"
          if [ -n "$D" ]; then ARGS="$ARGS --date $D"; else ARGS="$ARGS --yesterday"; fi
          python scripts/daily_alarm.py $ARGS > "$RUNNER_TEMP/alarm.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/alarm.md"

      - name: Raise the alarm
        if: steps.judge.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh issue comment "$REPORT_ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file "$RUNNER_TEMP/alarm.md" \
            || echo "::warning::could not comment on issue $REPORT_ISSUE_NUMBER"

      # THE ALARM COULD NOT REACH A PHONE, WHICH IS MOST OF WHY IT NEVER WORKED.
      #
      # This workflow is the only one allowed to be loud, and it was the only
      # publishing-adjacent workflow with no ntfy path — `daily.yml` and
      # `credentials.yml` both had one. So every alarm it raised went to a
      # comment on issue #1, which is also where scout results and daily
      # reports land: a firehose. It fired correctly on 09-06, 09-07, 09-08
      # and 09-09 — four consecutive days of "the day did not do what it was
      # supposed to" — and each one went unread while the channel posted one
      # or two videos a day instead of four.
      #
      # A detector nobody hears is not a detector. Same lesson as a capability
      # nothing calls, one layer out.
      - name: Push the alarm to a phone
        if: steps.judge.outputs.status != '0'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning title=alarm-cannot-reach-you::NTFY_TOPIC is not set,"
            echo "::warning::so this alarm exists only as a comment on issue"
            echo "::warning::#$REPORT_ISSUE_NUMBER and a red run. Set the secret"
            echo "::warning::to be told on the day something breaks."
            exit 0
          fi
          # First ~20 lines: the headline and the per-channel shortfall. The
          # rest is detail that belongs in the issue comment, not a push.
          MSG=$(head -20 "$RUNNER_TEMP/alarm.md" 2>/dev/null || echo "see the issue")
          curl -fsS -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" \
               -H "Title: Shorts pipeline — the day did not work" \
               -H "Tags: rotating_light" \
               -H "Priority: high" \
               -H "Click: https://github.com/${{ github.repository }}/issues/$REPORT_ISSUE_NUMBER" \
            || echo "::warning::ntfy push failed"

      - name: Fail the run so it is red in the Actions tab
        if: steps.judge.outputs.status != '0'
        run: |
          echo "::error::the day did not do what it was supposed to — see the"
          echo "::error::comment on issue #$REPORT_ISSUE_NUMBER"
          exit 1

      - name: Quiet day
        if: steps.judge.outputs.status == '0'
        run: echo "::notice::the day did what it was supposed to — staying quiet"
