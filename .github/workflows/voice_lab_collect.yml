# Voice lab: re-collect an earlier lab run's artifacts onto this branch (when
# its own collect lost a push race). Run id comes from voice_lab/collect_run_id.
name: Voice lab collect
on:
  push:
    branches: [voice-lab]
    paths: ['voice_lab/collect_run_id', '.github/workflows/voice_lab_collect.yml']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - id: r
        run: echo "id=$(cat voice_lab/collect_run_id)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with: { path: dl/, run-id: '${{ steps.r.outputs.id }}', github-token: '${{ github.token }}' }
      - run: sudo apt-get install -y -qq flac
      - run: |
          D=voice_lab/clean2; mkdir -p $D
          find dl -type f \( -name '*.mp3' -o -name '*.json' \) -exec cp {} $D/ \;
          find dl -name 'log_*.txt' -exec sh -c 'cp "$1" '$D'/run2_$(basename "$1")' _ {} \;
          find dl -name 'clean_*.wav' -exec sh -c 'flac -s -f --best -o '$D'/$(basename "$1" .wav).flac "$1"' _ {} \;
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add -f $D
          git commit -m "voice lab re-collect [skip ci]"
          ok=0; for i in 1 2 3 4; do git pull --rebase -q origin voice-lab && git push origin HEAD:voice-lab && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*3)); done; [ $ok = 1 ]
