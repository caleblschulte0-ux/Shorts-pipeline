# Voice lab: re-collect an earlier lab run's artifacts onto this branch (when
# its own collect lost a push race). Run id comes from voice_lab/collect_run_id.
name: Voice lab collect
on:
  push:
    branches: [voice-lab]
    paths: ['voice_lab/collect_run_id', '.github/workflows/voice_lab_collect.yml']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - id: r
        run: echo "id=$(cat voice_lab/collect_run_id)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with: { path: dl/, run-id: '${{ steps.r.outputs.id }}', github-token: '${{ github.token }}' }
      - run: |
          mkdir -p voice_lab/young
          find dl -type f \( -name '*.mp3' -o -name '*.txt' -o -name '*.json' -o -name '*.sha256' \) -exec cp {} voice_lab/young/ \;
          find dl -name 'globe_*.wav' -exec sh -c 'ffmpeg -y -loglevel error -i "$1" -ac 1 -c:a libopus -b:a 96k voice_lab/young/$(basename "$1" .wav).ogg' _ {} \;
          pip install -q openai-whisper
          python voice_lab/heard_young.py voice_lab/young || true
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add -f voice_lab/young
          git commit -m "voice lab young results [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin voice-lab && git push origin HEAD:voice-lab && break; sleep $((i*3)); done
