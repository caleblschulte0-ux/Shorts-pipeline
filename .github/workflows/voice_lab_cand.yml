# Voice lab round 11: every studio-clean voice on three processes, ranked by UTMOS.
# No secrets; read-only token; only collect writes, and only to this branch.
name: Voice lab candidates
on:
  push:
    branches: [voice-lab]
    paths: ['voice_lab/gen_cand.py', 'voice_lab/mos_all.py', '.github/workflows/voice_lab_cand.yml']
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job: ['chatterbox 0/3', 'chatterbox 1/3', 'chatterbox 2/3', 'cosyvoice 0/3', 'cosyvoice 1/3', 'cosyvoice 2/3',
              'zonos 0/5', 'zonos 1/5', 'zonos 2/5', 'zonos 3/5', 'zonos 4/5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng sox libsox-dev
      - shell: bash
        run: |
          set -- ${{ matrix.job }}; E=$1; S=$2
          mkdir -p out; L=out/log_install_$E_${S/\//_}.txt
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu >> $L 2>&1
          case $E in
            chatterbox) pip install -q chatterbox-tts==0.1.7 --extra-index-url https://download.pytorch.org/whl/cpu >> $L 2>&1 ;;
            zonos)
              git clone -q https://github.com/Zyphra/Zonos.git zonos_src >> $L 2>&1
              pip install -q -e zonos_src "transformers==4.49.0" >> $L 2>&1 ;;
            cosyvoice)
              git clone -q --recursive https://github.com/FunAudioLLM/CosyVoice.git >> $L 2>&1
              pip install -q conformer diffusers gdown hydra-core HyperPyYAML inflect librosa lightning matplotlib \
                modelscope networkx omegaconf onnx onnxruntime openai-whisper protobuf pydantic rich soundfile \
                tensorboard "transformers==4.49.0" x-transformers wget pyworld wetext huggingface_hub pyarrow >> $L 2>&1 ;;
          esac
          python voice_lab/gen_cand.py $E out $S 2>&1 | grep -v "it/s\]" | tail -40 || true
          rm -f out/log_install_*
      - id: n
        run: echo "n=$(echo '${{ matrix.job }}' | tr ' /' '__')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'cand_${{ steps.n.outputs.n }}', path: out/ }
  collect:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { path: dl/ }
      - shell: bash
        run: |
          D=voice_lab/cand; mkdir -p $D
          find dl -type f \( -name '*.mp3' -o -name 'log_*.txt' \) -exec cp {} $D/ \;
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q librosa
          python voice_lab/mos_all.py $D/mos.json $D voice_lab/diag voice_lab/clean2 voice_lab/clean voice_lab/final || true
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add -f $D
          git commit -m "voice lab candidates [skip ci]"
          ok=0; for i in 1 2 3 4; do git pull --rebase -q origin voice-lab && git push origin HEAD:voice-lab && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*3)); done; [ $ok = 1 ]
