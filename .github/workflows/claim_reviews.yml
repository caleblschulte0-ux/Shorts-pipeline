name: Claim mailbox verdicts (judge of last resort)

# docs/REVIEW_MAILBOX.md. ChatGPT graded a kept render into
# exchange/reviews/<date>/<id>.verdict.json (or answered an ask batch).
# This runs the grades through the SAME code every judge's grades go
# through, and on an explicit code-decided ship downloads the kept artifact,
# verifies its sha256 against the request, and uploads it the ordinary way.
# It never renders, never judges by itself, never weakens anything: a hold
# is a hold, and a story held here re-renders normally on its channel.
#
# Fires when a verdict lands on main; the hourly cron catches a verdict
# whose push carried [skip ci] or a claim that failed transiently. Every
# step is idempotent: a settled request is never re-claimed.

on:
  push:
    branches: [main]
    paths:
      - 'exchange/reviews/**/*.verdict.json'
      - 'exchange/rewrites/**/*.answer.json'
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: claim-reviews
  cancel-in-progress: false

permissions:
  contents: write          # persist posted logs + settled requests
  actions: read            # download the kept-render artifact

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Anything to claim?
        id: any
        run: |
          n=$(python3 - <<'PY'
          import json, pathlib
          n = 0
          for idx in ("exchange/reviews/OPEN.json", "exchange/rewrites/OPEN.json"):
              try:
                  n += len(json.loads(pathlib.Path(idx).read_text()).get("open") or [])
              except Exception:
                  pass
          print(n)
          PY
          )
          echo "open=$n" >> "$GITHUB_OUTPUT"
          echo "open review requests: $n"

      - uses: actions/setup-python@v5
        if: steps.any.outputs.open != '0'
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.any.outputs.open != '0'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Pre-flight — kill switch
        if: steps.any.outputs.open != '0'
        run: |
          [ -f PAUSED ] && { echo "Pipeline paused (PAUSED file)"; exit 1; }
          exit 0

      # This workflow's judge is the MAILBOX VERDICT — graded anchors from
      # ChatGPT, decided by the same code as every judge — so it publishes
      # nothing a rate-limited Claude could have stopped it from publishing.
      # The token is still checked the way every publishing workflow checks
      # it (CLAUDE.md, tests/test_no_ungated_publish.py): an UNSET secret is
      # a misconfigured repo and must be loud, not silent.
      - name: Pre-flight — a fail-closed gate needs a judge
        if: steps.any.outputs.open != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::no judge secret at all (CLAUDE_CODE_OAUTH_TOKEN / GEMINI_API_KEY) — the repo is misconfigured; the mailbox verdict still decides here, but fix the secrets"
            exit 1
          fi
          echo "judge of record for this workflow: the ChatGPT mailbox verdict, decided by code"

      # REWRITES: ChatGPT's words for held explainer stories, validated by
      # code (numbers derivable from the data, no new entities, the same
      # deterministic gate must pass) before they touch niche.config.json.
      - name: Claim rewrites (validate + apply)
        id: rewrites
        if: steps.any.outputs.open != '0'
        run: |
          out=$(python scripts/claim_rewrites.py claim 2>&1 | tee /dev/stderr)
          applied=$(echo "$out" | grep -o 'applied=[0-9]*' | tail -1 | cut -d= -f2)
          echo "applied=${applied:-0}" >> "$GITHUB_OUTPUT"

      - name: Decide, then publish only a code-decided ship
        if: steps.any.outputs.open != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_EXPLAINER: ${{ secrets.YOUTUBE_TOKEN_JSON_EXPLAINER }}
          # OpenRangeInteractive sleep films held by the mailbox
          YOUTUBE_TOKEN_JSON_CURIOSITY: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY || secrets.YOUTUBE_TOKEN_JSON_ORI }}
          # the uploader's auto-localization layer; absent keys degrade quietly
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/claim_reviews.py --channel all --publish

      - name: Persist settled requests + posted logs
        if: always() && steps.any.outputs.open != '0'
        run: |
          # An APPLIED rewrite is new content in niche.config.json, and that
          # file's push is the explainer workflow's trigger — so leave
          # [skip ci] OFF when one was applied, and the fixed story renders
          # within the hour instead of at the next cron.
          if [ "${{ steps.rewrites.outputs.applied }}" != "0" ] && [ -n "${{ steps.rewrites.outputs.applied }}" ]; then
            msg="claim: ${{ steps.rewrites.outputs.applied }} ChatGPT rewrite(s) applied $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            msg="claim: mailbox verdicts $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          fi
          bash scripts/ci_commit_state.sh "$msg" \
            exchange/reviews exchange/rewrites data_learning/niche.config.json \
            state/scene_plans state/explainer_posted_log.json state/posted_log.json \
            state/showrunner_verdicts.jsonl
