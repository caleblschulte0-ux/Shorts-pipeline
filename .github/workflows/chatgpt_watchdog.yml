name: ChatGPT watchdog

# DID THE SCHEDULED CHATGPT TASK LEAVE ITS ARTIFACT? We answer, not it.
#
# On 2026-08-12 all three ChatGPT tasks fired on time and committed nothing:
# no media-progress/STARTED.json, no response.json, no DONE, no
# doctor/reports/20260812.json. Nothing noticed until a human looked at
# 13:00 UTC, because `daily_alarm` runs at 01:15 UTC — a 06:03 CT failure
# went unreported for nearly twenty hours, long past the point where
# re-firing the task could still have saved the day.
#
# This is the deterministic half of the boundary: ChatGPT supplies judgment
# and content, WE verify and record. The check reads the filesystem, writes
# state/chatgpt_tasks/<date>/<task>.json, and exits non-zero when a required
# artifact is missing — so the run goes RED and the alarm reads a verdict
# somebody actually took, at a known time.
#
# CRONS ARE PAIRED AND GATED IN CODE, never a single UTC cron. Everything
# here is scheduled in CENTRAL time and the UTC offset moves an hour at DST;
# `chatgpt_watchdog._deadline_passed` does the real judging with zoneinfo, so
# a run that fires "early" simply reports `pending` and costs nothing. This
# is the same rule that keeps Phase B's backstop from landing before the
# finalizer for half of every year.
on:
  schedule:
    - cron: '15 12 * * *'   # 07:15 CDT / 06:15 CST — media deadline
    - cron: '15 13 * * *'   # 08:15 CDT / 07:15 CST — media (CST) + finalizer
    - cron: '15 14 * * *'   # 09:15 CDT / 08:15 CST — finalizer (CST) + doctor
    - cron: '15 15 * * *'   # 10:15 CDT / 09:15 CST — doctor (CST)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to judge (YYYYMMDD, default today UTC)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: chatgpt-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Judge every ChatGPT task
        id: judge
        run: |
          set +e
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(date -u +%Y%m%d)
          python3 scripts/chatgpt_watchdog.py --all --date "$DATE"
          RC=$?
          # YESTERDAY is where every task is definitively judgeable — the
          # doctor files nightly (~23:00 CT), so today's can never be late
          # during the morning. Judging both means the doctor gets a real
          # verdict exactly once, the morning after.
          YDAY=$(date -u -d "$DATE -1 day" +%Y%m%d 2>/dev/null || echo "")
          if [ -n "$YDAY" ]; then
            python3 scripts/chatgpt_watchdog.py --all --date "$YDAY"
            [ $? -ne 0 ] && RC=1
          fi
          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      # The record is the point — it is what the alarm reads and what proves
      # WHEN we checked. Committed even (especially) on a failure.
      - name: Persist the verdicts
        run: |
          bash scripts/ci_commit_state.sh \
            "watchdog: chatgpt task verdicts ${{ steps.judge.outputs.date }} [skip ci]" \
            state/chatgpt_tasks || echo "::warning::verdict commit failed"

      # RED means a task fired and left nothing. That is a FAILED run, not an
      # idle day, and the workflow must say so out loud.
      - name: Fail the run when an artifact is missing
        if: steps.judge.outputs.rc != '0'
        run: |
          echo "::error::CHATGPT TASK FAILED / NO ARTIFACT for ${{ steps.judge.outputs.date }} — see state/chatgpt_tasks/${{ steps.judge.outputs.date }}/"
          exit 1
