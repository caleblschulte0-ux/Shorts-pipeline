name: Curiosity Long-form

# Posts the EVERGREEN visual-curiosity LONG-FORM videos (4-5 min, 1920x1080,
# main watch feed — NOT Shorts) to the OpenRangeInteractive channel.
# CURIOSITY_BRAIN.md is the doctrine. Fully separate from daily.yml /
# explainer.yml / third.yml: own config (data_learning/curiosity.config.json),
# own renderer (canonical: the pro producer scripts/produce.py -> pro_render +
# the full director loop; longform_render is the legacy except-branch fallback),
# own posted-log
# (state/curiosity_posted_log.json), own token secret, own concurrency group.
#
# Cadence: 1/week (Saturdays 15:00 UTC) — the cron posts at most ONE un-posted
# story per run. The daily Claude routine keeps the queue stocked
# (CLAUDE_ROUTINE_INSTRUCTIONS.md Part 3).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sleep (the weekly film) | verify | canary | schedule | all | preview | pro | batch'
        required: true
        default: 'sleep'
        type: choice
        options: [sleep, verify, canary, schedule, all, preview, pro, batch]
      batch_max:
        description: 'batch mode: how many stories to render (default 2)'
        required: false
        default: '1'
      repair_attempts:
        description: 'render->judge->REPAIR rounds per story (each is a full
          re-render; 2 fits the 335-min cap at ~2h a cut, 1 disables repair)'
        required: false
        default: '2'
      canary_slug:
        description: 'slug to post in canary mode'
        required: false
        default: 'kola-deepest-hole'
      slugs:
        description: 'space-separated slugs (blank = un-posted, config order)'
        required: false
        default: ''
      expected_channel:
        description: 'channel guard override (blank = OpenRangeInteractive)'
        required: false
        default: ''
      max:
        description: 'schedule: post at most N stories this run'
        required: false
        default: '1'
      enable_publish:
        description: 'UPLOAD GATE: publishing is frozen unless this is checked
          (sets CURIOSITY_PUBLISH_ENABLED=1). Cron/auto can never set it, so
          scheduled runs render/review/package/HOLD.'
        required: false
        default: false
        type: boolean
      publish_in_hours:
        description: 'schedule the upload N hours out (0 = public now)'
        required: false
        default: '0'
      force:
        description: 're-post even if already in the posted-log'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      hero_res:
        description: 'Blender hero resolution WxH (blank = CI default 960x540; full quality is 1440x810 but will NOT fit GitHub''s 6h cap — use a faster host)'
        required: false
        default: ''
      hero_samples:
        description: 'Blender hero Cycles samples (blank = CI default 24; full quality is 32)'
        required: false
        default: ''
  # THE SLEEP-FILM CADENCE (operator, 2026-09-23: "we do like one video like
  # a week ... that going to sleep niche"). One two-hour film a week, drawn
  # by the doodle kit, judged by the fail-closed showrunner before it can
  # upload (scripts/post_ori.py, docs/ORI_DOCUMENTARY.md). Friday 19:00 UTC
  # so it lands in the US evening. The old pro-producer cron stays retired.
  schedule:
    - cron: '0 19 * * 5'

permissions:
  contents: write          # persist state/curiosity_posted_log.json

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ------------------------------------------------------------------
  # OpenRangeInteractive SLEEP FILM — the channel's production path.
  # Make sure one script is ready -> render -> showrunner -> upload ->
  # write next week's script. Uploads on the cron, and on a dispatch only
  # with enable_publish.
  # ------------------------------------------------------------------
  sleep:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'sleep')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: curiosity-longform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Pre-flight — kill switch, secrets, a judge
        env:
          YT_CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY || secrets.YOUTUBE_TOKEN_JSON_ORI }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f PAUSED ] || [ -f state/curiosity_kill_switch ]; then
            echo "Pipeline paused (PAUSED or state/curiosity_kill_switch)."
            exit 1
          fi
          [ -z "$YT_CLIENT" ] && { echo "::error::missing YOUTUBE_CLIENT_SECRETS_JSON"; exit 1; }
          [ -z "$YT_TOKEN" ] && { echo "::error::missing YOUTUBE_TOKEN_JSON_CURIOSITY (or _ORI)"; exit 1; }
          # THE GATE NEEDS A JUDGE OR IT HOLDS EVERYTHING (CLAUDE.md)
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::no CLAUDE_CODE_OAUTH_TOKEN and no GEMINI_API_KEY — the fail-closed showrunner would hold every episode"
            exit 1
          fi
          echo "Pre-flight OK."
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install deps
        run: |
          sudo apt-get update -qq
          # libcairo2-dev + pkg-config: pycairo draws every frame (data_learning/doodle)
          sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config
          pip install --upgrade pip
          pip install -r requirements.txt -r data_learning/requirements.txt pycairo
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 \
            && echo "claude CLI installed" \
            || echo "::warning::claude CLI install failed — judge falls back to Gemini"
      - name: Cache Kokoro TTS models (~350MB)
        id: cache-kokoro-sleep
        uses: actions/cache@v4
        with:
          path: kokoro_models/
          key: kokoro-onnx-v1.0
      - name: Download Kokoro TTS models if cache miss
        if: steps.cache-kokoro-sleep.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro_models
          curl -fsSL -o kokoro_models/kokoro-v1.0.onnx \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          curl -fsSL -o kokoro_models/voices-v1.0.bin \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
      - name: Cache sleep music
        uses: actions/cache@v4
        with:
          path: data_learning/music/sleep/
          key: music-sleep-${{ hashFiles('scripts/fetch_music.py') }}
      - name: Fetch sleep music
        run: python3 scripts/fetch_music.py --only sleep
      - name: Make sure one script is ready
        continue-on-error: true
        timeout-minutes: 110
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/ori_author.py --if-empty
      - name: Render, judge, publish
        timeout-minutes: 230
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON_CURIOSITY: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY || secrets.YOUTUBE_TOKEN_JSON_ORI }}
          YOUTUBE_EXPECTED_CHANNEL: ${{ inputs.expected_channel || vars.CURIOSITY_EXPECTED_CHANNEL || 'OpenRangeInteractive' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ~50 sampled frames of a two-hour film; a timeout is still a HOLD
          SHOWRUNNER_TIMEOUT: '1800'
        run: |
          ARGS=""
          SLUG="$(echo "${{ inputs.slugs }}" | awk '{print $1}')"
          [ -n "$SLUG" ] && ARGS="$ARGS --slug $SLUG"
          # A cron firing has no inputs and publishes; a dispatch publishes
          # only when the operator ticks enable_publish.
          if [ "${{ github.event_name }}" != "schedule" ] && \
             [ "${{ inputs.enable_publish }}" != "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/post_ori.py $ARGS
      - name: Did the channel actually post this week?
        # The exit code cannot answer this: a gate hold is not a fault. So
        # on a scheduled (publishing) run, ask the business question and go
        # RED when nothing reached the channel — a week that ships nothing
        # is the thing worth an alarm, whether the cause was the gate, a
        # crash, or a dark judge (whose held film the mailbox now carries).
        if: always() && github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, datetime
          p = "state/curiosity_posted_log.json"
          today = datetime.datetime.now(datetime.timezone.utc).date()
          try:
              posted = json.load(open(p)).get("posted", {})
          except Exception as e:
              print(f"::error title=posted-log-unreadable::{e}")
              raise SystemExit(1)
          recent = [k for k, v in posted.items()
                    if str(v.get("at", ""))[:10] >= (today - datetime.timedelta(days=1)).isoformat()]
          if recent:
              print(f"::notice title=posted-this-week::{recent}")
          else:
              print("::error title=nothing-posted-this-week::no sleep film reached the "
                    "channel this run — held by the gate, a dark judge (see the review "
                    "mailbox), or a crash above.")
              raise SystemExit(1)
          PY
      - name: Keep the render (watch exactly what the judge watched)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ori-sleep-${{ github.run_id }}
          path: |
            output/ori_*.mp4
            output/ori_*.jpg
            output/ori_*.srt
            output/ori_*.meta.json
            output/ori_*.result.json
            output/ori_*.showrunner.json
          if-no-files-found: ignore
          retention-days: 30
      # THE JUDGE OF LAST RESORT (docs/REVIEW_MAILBOX.md). A film nobody
      # could watch is held by the gate AND kept here as an artifact, with
      # its frames published to preview-renders and a review request filed
      # for ChatGPT; claim_reviews.yml ships it later on a code-decided ship.
      - name: Keep held renders for the mailbox judge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-renders-${{ github.run_id }}
          path: |
            output/held/*.mp4
            output/held/*.json
            output/held/*.jpg
            output/held/*.srt
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish review frames to preview-renders
        if: always()
        run: |
          if [ -d output/review_media ]; then
            bash scripts/publish_review_media.sh output/review_media || {
              python3 scripts/claim_reviews.py --withdraw-stage output/review_media
              exit 1
            }
          fi
      - name: Write next week's script
        if: always()
        continue-on-error: true
        timeout-minutes: 100
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/ori_author.py
      - name: Persist posted log + new scripts
        if: always()
        env:
          # back to the ref this ran FROM: a branch dispatch never writes main
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/ci_commit_state.sh \
            "curiosity: sleep film log + scripts [skip ci]" \
            state/curiosity_posted_log.json state/ori_pending.json state/ori_storyboard.jsonl \
            state/showrunner_verdicts.jsonl data_learning/ori_episodes \
            exchange/reviews

  # Cheap gate: on the cron, only spin up the heavy render job if there is
  # actually something un-posted to ship.
  plan:
    runs-on: ubuntu-latest
    outputs:
      new_count: ${{ steps.count.outputs.new_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Count un-posted stories
        id: count
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open('data_learning/curiosity.config.json'))
          posted = set()
          p = 'state/curiosity_posted_log.json'
          if os.path.exists(p):
              posted = set(json.load(open(p)).get('posted', {}))
          new = [s['slug'] for s in cfg.get('stories', []) if s['slug'] not in posted]
          print('new_count=' + str(len(new)))
          PY
          echo "::notice::un-posted curiosity stories: $(grep new_count "$GITHUB_OUTPUT" | tail -1)"

  curiosity:
    needs: plan
    # the pro/legacy paths are manual-only now; the cron runs `sleep`
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode != 'sleep'
    runs-on: ubuntu-latest
    # preview renders the PREMIUM cut (all Cycles heroes) on GitHub's own
    # infra — independent of any local session. 335 min sits safely under
    # GitHub's 6-hour hard job cap; the director self-limits Cycles frames
    # (CURIO_PREMIUM_FRAMES) so the whole render finishes with headroom.
    timeout-minutes: 335
    concurrency:
      group: curiosity-longform
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Pre-flight — kill switch + secrets + channel guard
        env:
          YT_CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          # Canonical name first; _ORI accepted as the operator-created alias.
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY || secrets.YOUTUBE_TOKEN_JSON_ORI }}
          # Hard default to the real channel (OpenRangeInteractive / @ORI);
          # repo var CURIOSITY_EXPECTED_CHANNEL can override if renamed.
          EXPECTED: ${{ inputs.expected_channel || vars.CURIOSITY_EXPECTED_CHANNEL || 'OpenRangeInteractive' }}
        run: |
          [ -f PAUSED ] && { echo "Pipeline paused (PAUSED file)"; exit 1; }
          MODE="${{ inputs.mode }}"; [ -z "$MODE" ] && MODE="auto"
          # verify/preview/pro never upload, so they may run without upload wiring
          if [ "$MODE" != "verify" ] && [ "$MODE" != "preview" ] && [ "$MODE" != "pro" ]; then
            missing=0
            [ -z "$YT_CLIENT" ] && { echo "::error::missing secret YOUTUBE_CLIENT_SECRETS_JSON"; missing=1; }
            [ -z "$YT_TOKEN" ] && { echo "::error::missing secret YOUTUBE_TOKEN_JSON_CURIOSITY (or its alias YOUTUBE_TOKEN_JSON_ORI) — mint it with setup_youtube.py signed into the OpenRangeInteractive account"; missing=1; }
            [ -z "$EXPECTED" ] && { echo "::error::channel guard is empty — set CURIOSITY_EXPECTED_CHANNEL"; missing=1; }
            [ $missing -ne 0 ] && exit 1
          fi
          echo "Pre-flight OK."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system deps
        # blender: the headless Cycles hero-shot renderer (blender -b);
        # pango/cairo dev libs: manimpango build deps for Manim.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q ffmpeg blender libpango1.0-dev libcairo2-dev pkg-config
          blender --version | head -1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          # Ubuntu's debian-patched setuptools breaks sdist builds (srt, a
          # manim dep) with "AttributeError: install_layout" — replace it.
          pip install --ignore-installed --upgrade setuptools wheel
          pip install -r requirements.txt -r data_learning/requirements.txt
          # Manim animates the data beats (curiosity_scenes.py). TeX-free by
          # design — do NOT add a LaTeX install here.
          pip install --quiet manim || echo "::warning::manim install failed — beats degrade to stills"
          pip install --quiet rembg || echo "rembg install failed (chroma fallback)"

      - name: Cache rembg model (~170MB)
        if: inputs.mode != 'verify'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1

      - name: Cache Kokoro TTS models (~350MB)
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: kokoro_models/
          key: kokoro-onnx-v1.0

      - name: Download Kokoro TTS models if cache miss
        if: steps.cache-kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro_models
          curl -fsSL -o kokoro_models/kokoro-v1.0.onnx \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          curl -fsSL -o kokoro_models/voices-v1.0.bin \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"

      # Royalty-free music library (Kevin MacLeod, CC-BY) for the music bed.
      - name: Cache music library (~110MB)
        if: inputs.mode != 'verify'
        id: cache-music
        uses: actions/cache@v4
        with:
          path: data_learning/music/
          key: music-kmcl-${{ hashFiles('scripts/fetch_music.py') }}

      - name: Fetch music if missing
        if: inputs.mode != 'verify' && steps.cache-music.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_music.py

      # MEDIA PROBE — seconds, not hours. Three renders credited zero Pexels
      # and zero Pixabay while both secrets existed in the repo, and guessing
      # cost a full render each time. This calls every video provider live with
      # the same code the renderer uses and reports key presence (never the
      # value), HTTP result and candidate counts, so the media supply can be
      # diagnosed without burning 1h48m to find out.
      - name: Media probe (which video providers actually answer)
        if: always()
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 scripts/media_probe.py --decide

      # Its own artifact, on EVERY mode — verify skips the status upload, and
      # the job-log API truncates, so without this the probe's answer is only
      # visible by opening the run by hand. Same law as the judging evidence:
      # a result that cannot be read after the runner disappears is missing.
      - name: Upload media probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-media-probe
          path: output/media_probe.json
          retention-days: 90
          if-no-files-found: warn

      - name: Run
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          # uploader(channel="curiosity") reads this env var; the secret may
          # live under either name (_ORI is the operator-created alias).
          YOUTUBE_TOKEN_JSON_CURIOSITY: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY || secrets.YOUTUBE_TOKEN_JSON_ORI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # STOCK VIDEO — top of the media pipeline. Without these the
          # motion-first gate can never reach ground / human-scale footage
          # (NASA is orbital-only) and depiction beats fall back to stills.
          # The secrets already exist (daily.yml uses them); this channel
          # simply was not forwarding them to the render.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # CI runs on a 4-core runner under a 6h cap: render the Cycles
          # heroes at 960x540/24 (upscaled to 1080p by minterpolate; flat
          # toon shading upscales cleanly) so the full premium cut finishes
          # in ~2.5h with margin. A faster host leaves these unset for full
          # 1440x810/32 quality.
          CURIO_HERO_RES: ${{ inputs.hero_res || '960x540' }}
          CURIO_HERO_SAMPLES: ${{ inputs.hero_samples || '24' }}
          # THE CLOSED REPAIR LOOP (scripts/produce.py). How many
          # render -> judge -> repair -> re-render rounds one story may spend.
          # Each round is a FULL re-render, so this is bounded by the job's
          # 335-minute cap rather than by the policy's attempt budget: at ~2h a
          # cut, 2 rounds fit with margin and 3 would risk timing out, which
          # would deliver nothing at all instead of a judged quarantine.
          CURIOSITY_REPAIR_ATTEMPTS: ${{ inputs.repair_attempts || '2' }}
          # ...and the attempt COUNT alone cannot honour that cap, because it
          # does not know how long a cut takes. The 2026-08-01 shared-air run
          # proved the comment above optimistic: attempt 1 took 145 min, so
          # round 2 began with ~3h of job left and the round-1 package was at
          # risk of dying with the runner. Give the producer the real clock —
          # the job's 335 min less ~35 for setup, caches, media probe and the
          # artifact uploads — so it can decline a render it cannot finish and
          # ship the judged package it already has.
          CURIOSITY_WALLCLOCK_S: '18000'
          # PHASE-3 ROUTING (docs/CURIOSITY_RECOVERY_MANIFEST.md):
          # - the canonical producer is the ONLY default renderer; legacy needs
          #   an operator to export CURIOSITY_RENDERER=legacy by hand.
          # - uploading needs the explicit enable_publish input. A cron firing
          #   has no inputs, so scheduled runs always HOLD after packaging.
          CURIOSITY_PUBLISH_ENABLED: ${{ inputs.enable_publish == true && '1' || '' }}
        run: |
          set -e
          MODE="${{ inputs.mode }}";                 [ -z "$MODE" ] && MODE="auto"
          EXPECTED="${{ inputs.expected_channel }}"
          [ -z "$EXPECTED" ] && EXPECTED="${{ vars.CURIOSITY_EXPECTED_CHANNEL }}"
          [ -z "$EXPECTED" ] && EXPECTED="OpenRangeInteractive"
          MAX="${{ inputs.max }}";                   [ -z "$MAX" ] && MAX="1"
          PUB="${{ inputs.publish_in_hours }}";      [ -z "$PUB" ] && PUB="0"
          SLUGS="$(echo "${{ inputs.slugs }}" | tr ',' ' ' | tr -s ' ')"
          SLUGS="${SLUGS#"${SLUGS%%[![:space:]]*}"}"
          SLUGFLAG=""; [ -n "$SLUGS" ] && SLUGFLAG="--slugs $SLUGS"
          FORCEFLAG=""; [ "${{ inputs.force }}" = "true" ] && FORCEFLAG="--force"
          export YOUTUBE_EXPECTED_CHANNEL="$EXPECTED"
          echo "mode=$MODE expected=$EXPECTED max=$MAX publish_in=$PUB slugs='${SLUGS:-<un-posted>}'"
          case "$MODE" in
            verify)
              python scripts/post_curiosity.py --check-channel ;;
            canary)
              python scripts/post_curiosity.py --slugs "${{ inputs.canary_slug }}" --max 1 ;;
            schedule)
              python scripts/post_curiosity.py $SLUGFLAG $FORCEFLAG \
                --max "$MAX" --publish-in-hours "$PUB" ;;
            all)
              python scripts/post_curiosity.py $SLUGFLAG $FORCEFLAG ;;
            preview)
              # PREVIEW = THE SAME CANONICAL PRODUCER, different destination
              # (Phase 3 §8.3: modes may differ in output/publishing, never in
              # the creative path). Renders through scripts/produce.py — the
              # full director loop + gates + package — into preview/, uploads
              # everything as an artifact, uploads nothing to YouTube. A
              # quarantine verdict is a valid preview outcome (|| true): the
              # artifact carries the produce_report with the reasons.
              mkdir -p preview
              for s in $SLUGS; do
                python scripts/produce.py "$s" "preview/$s.mp4" || \
                  echo "::warning::$s quarantined — see produce_report in artifact"
                # mobile-friendly viewing copy (small, streams on a phone)
                ffmpeg -y -loglevel error -i "preview/$s.mp4" \
                  -vf scale=1280:720 -c:v libx264 -preset slow -crf 26 \
                  -c:a aac -b:a 128k "preview/${s}_720p.mp4" || true
              done
              # Commit the LIGHT record (sheets/meta/report) to the branch;
              # the heavy mp4s ride the artifact, not git history.
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -f preview/*.jpg preview/*.meta.json \
                preview/*_pkg/contact_sheet.png preview/*_pkg/beatmap.json \
                preview/*_pkg/produce_report.json \
                preview/*_pkg/fallbacks.json 2>/dev/null || true
              git commit -m "curiosity preview render: $SLUGS [skip ci]" || echo "nothing to commit"
              for i in 1 2 3 4 5; do
                git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "pushed on attempt $i"; break; }
                echo "push failed on attempt $i, rebasing (autostash, ours)..."
                git pull --rebase --autostash -X ours origin "${GITHUB_REF_NAME}" \
                  || git rebase --abort || true
                sleep 2
              done ;;
            pro)
              # Single-slug preview through THE SAME canonical producer
              # (kept as a mode name for muscle memory; it is preview for one
              # slug). Never a bare pro_render call — the director loop and
              # gates are not optional (Phase 3 §8.3).
              mkdir -p preview
              S="${SLUGS:-sitting-still-speed}"
              python scripts/produce.py "$S" "preview/${S}.mp4" || \
                echo "::warning::$S quarantined — see produce_report in artifact"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -f "preview/${S}_720p.mp4" \
                "preview/${S}_pkg/contact_sheet.png" \
                "preview/${S}_pkg/beatmap.json" \
                "preview/${S}_pkg/continuity.json" 2>/dev/null || true
              git commit -m "curiosity pro render: ${S} [skip ci]" \
                || echo "nothing to commit"
              for i in 1 2 3 4 5; do
                git push origin "HEAD:${GITHUB_REF_NAME}" && break
                git pull --rebase --autostash -X ours origin \
                  "${GITHUB_REF_NAME}" || git rebase --abort || true
                sleep 2
              done ;;
            batch)
              # BOUNDED AUTONOMOUS BATCH (scripts/batch_produce.py): admit
              # from the real catalog, then render+gate story by story under
              # count and wall-clock budgets, deciding per story. This mode
              # NEVER publishes — it ends at the gate, exactly like preview;
              # uploading still requires post_curiosity with its own gates,
              # approval, kill switch, and CURIOSITY_PUBLISH_ENABLED=1.
              # --slugs (if given) targets specific stories; otherwise
              # portfolio admission picks them.
              python scripts/batch_produce.py --plan
              python scripts/batch_produce.py --run $SLUGFLAG \
                --max-stories "${{ inputs.batch_max || '1' }}" \
                --budget-seconds "${BATCH_BUDGET:-18000}" \
                || echo "::warning::batch ended early — see batch_run_report"
              python scripts/pipeline_health.py || true ;;
            auto)
              # weekly cron: post exactly one un-posted story
              python scripts/post_curiosity.py --max 1 ;;
          esac

      # THE GUARANTEE: the finished preview (full 1080p + 720p viewing copy
      # + frame/evidence sheets + ledger + director report) is uploaded as
      # a downloadable artifact, kept 90 days. always() so a partial render
      # still hands back whatever it produced. This is what makes "a video
      # in ~6 hours no matter what" true — it does not depend on any local
      # session surviving.
      - name: Upload preview artifact
        if: always() && (inputs.mode == 'preview' || inputs.mode == 'pro')
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-preview
          path: |
            preview/*.mp4
            preview/*.png
            preview/*.jpg
            preview/*.srt
            preview/*.ledger.json
            preview/*.director.json
            preview/*.meta.json
            preview/*_pkg/*.png
          retention-days: 90
          if-no-files-found: warn

      # Run-health + capability readiness from the hash-chained ledger and
      # the artifacts this run produced. Reporting only — never gates.
      - name: Pipeline status
        if: always() && inputs.mode != 'verify'
        continue-on-error: true
        run: python3 scripts/pipeline_health.py

      # THE JUDGE EVIDENCE SURFACE. A judge response that cannot be viewed
      # after the runner disappears is treated as MISSING judge evidence — so
      # the concise scoreboard goes to the run summary and the COMPLETE
      # per-attempt evidence (raw + normalized, every judge, every repair plan)
      # is uploaded as its own artifact.
      - name: Judge report + step summary
        if: always() && inputs.mode != 'verify'
        continue-on-error: true
        run: |
          shopt -s nullglob
          for mp4 in output/curiosity_*.mp4; do
            case "$mp4" in *_720p.mp4) continue;; esac
            python3 scripts/judge_report.py "$mp4" || true
          done

      - name: Upload judging evidence (every judge, every attempt)
        if: always() && inputs.mode != 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-judging
          path: |
            output/curiosity_*_pkg/judging/**
          retention-days: 90
          if-no-files-found: warn

      - name: Upload batch video + package
        if: always() && inputs.mode == 'batch'
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-batch-video
          path: |
            output/curiosity_*.mp4
            output/curiosity_*_720p.mp4
            output/curiosity_*.jpg
            output/curiosity_*.srt
            output/curiosity_*.meta.json
            output/curiosity_*_pkg/**
          retention-days: 90
          if-no-files-found: warn

      - name: Upload status + batch reports
        if: always() && inputs.mode != 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-status
          path: |
            output/pipeline_status.json
            output/media_probe.json
            output/batch_*.json
            output/idea_funnel_report.json
            output/*.advisor.json
            output/*.security.json
            output/*.facts-report.json
          retention-days: 90
          if-no-files-found: ignore

      # Pull view/like counts so the daily routine learns which pillars and
      # hooks land (state/analytics_curiosity/latest.json).
      - name: Fetch curiosity analytics
        if: always() && inputs.mode != 'verify' && inputs.mode != 'preview'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON_CURIOSITY: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY || secrets.YOUTUBE_TOKEN_JSON_ORI }}
        run: |
          python3 scripts/fetch_analytics.py --channel curiosity --max-age-days 90 \
            || { echo "analytics fetch skipped"; exit 0; }

      - name: Persist posted log + analytics
        if: always() && inputs.mode != 'verify' && inputs.mode != 'preview'
        run: |
          git add state/curiosity_posted_log.json state/analytics_curiosity state/translation_cache.json 2>/dev/null || true
          # auto-filed exchange asks (generated-media loop) must survive the
          # runner, or the ask the render just filed dies with the container
          git add exchange/requests/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "curiosity: update posted log + analytics [skip ci]"
          # Robust push (same hardening as explainer.yml): --autostash rides
          # over render-dirtied files, -X ours keeps our fresh log on a race,
          # retries ride out concurrent pushes from scout/daily. Push to the
          # ref the workflow ran FROM (== main on cron; the feature branch on
          # a branch dispatch) so a branch run can never implicitly merge the
          # whole branch into main.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, rebasing (autostash, ours)..."
            git pull --rebase --autostash -X ours origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep 2
          done
          echo "::error::Failed to persist posted log after 5 attempts"
          exit 1
