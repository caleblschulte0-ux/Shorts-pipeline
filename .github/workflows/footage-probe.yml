name: Footage probe

# Which free route still hands this runner sports footage for cut-ins and
# montages (scripts/footage_probe.py). Publishes nothing. Manual only.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Who to look for"
        required: true
        default: "Jalen Brunson"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Probe (publishes nothing)
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          QUERY: ${{ inputs.query }}
        run: python scripts/footage_probe.py "$QUERY"
