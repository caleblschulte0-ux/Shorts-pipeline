name: Verify main (executable pushes)

# Doctor 500b791bc671. The full suite used to run ONLY on claude/* pull
# requests (auto-merge.yml), yet exchange_phase_a.yml documents human/PAT
# pushes straight to main as a supported path -- so executable code could
# land on main with no suite behind it. This runs the same suite after any
# push that changes Python, tests or workflows. It is a REPORT (main is
# already changed), never a gate: it writes nothing back, so it cannot
# recurse into a state commit. State-only, report-only and doc-only pushes
# do not match the path filter and cost nothing.
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - '.github/workflows/**'
      - 'config/channel_registry.json'

permissions:
  contents: read

concurrency:
  group: main-verify
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      # Same environment as auto-merge.yml's `tests` job (see its notes).
      - name: Install test deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 \
            libcairo2-dev pkg-config
          pip install -q pillow pyyaml requests numpy matplotlib cairosvg pycairo
      - name: Workflows parse
        run: |
          python -c "
          import yaml, glob, sys
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
          print('workflows parse')"
      - name: Full unit suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tail -40
      - name: Split-worker dry run (offline)
        run: python scripts/exchange_dry_run.py
      - name: Channel-contract acceptance
        run: python scripts/registry_acceptance.py
