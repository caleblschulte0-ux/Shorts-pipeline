name: Channel about

# Sets a YouTube channel's description (scripts/channel_about.py). Manual
# only: a bio is changed when someone asks for it, never on a schedule.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'explainer, third or trending'
        required: true
      text:
        description: 'The new description (\n for a new line)'
        required: true
      dry_run:
        description: 'true = print old and new, change nothing'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  about:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-oauthlib
      - name: Set the description
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_EXPLAINER: ${{ secrets.YOUTUBE_TOKEN_JSON_EXPLAINER }}
          YOUTUBE_TOKEN_JSON_THIRD: ${{ secrets.YOUTUBE_TOKEN_JSON_THIRD }}
          CHANNEL: ${{ inputs.channel }}
          TEXT: ${{ inputs.text }}
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="--dry-run"
          python scripts/channel_about.py --channel "$CHANNEL" --text "$TEXT" $args
