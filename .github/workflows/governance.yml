name: Authorship gate (main)

# Operator ruling: CLAUDE is the only agent that edits this pipeline.
# ChatGPT can run quarterback when the Claude subscription is out — writing
# the day's CONTENT and its retro SUGGESTIONS — but it never makes
# additions. This is the detective control on the other side of that rule.
#
# It runs on every push to main because that is the one path an agent with
# repo write access could take to change behaviour without review: a PR runs
# the sanity gate, the placement gate and this same check, but a direct push
# runs none of them. CI's own state commits touch data only and pass clean.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classify what this push changed
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set +e
          # A squash-merged PR lands on main as one commit ending in "(#NNN)".
          # That change WAS reviewed, so pipeline edits in it are expected.
          PR_FLAG=""
          case "$MSG" in *"(#"*")"*) PR_FLAG="--pr";; esac
          # First push of a new branch has an all-zero `before`.
          case "$BEFORE" in 0000000000000000000000000000000000000000)
            echo "new ref — nothing to compare"; exit 0;; esac
          python3 scripts/authorship_gate.py $PR_FLAG \
            --base "$BEFORE" --head "$AFTER"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit $?

      - name: Raise it loudly
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.REPORT_ISSUE_NUMBER || '1' }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body \
            "**Authorship gate failed on main** (${{ github.sha }}).

          Something changed pipeline code outside a reviewed PR, or dropped a
          code file into an agent's data area. Claude is the only agent that
          edits this pipeline — see \`CLAUDE.md\`. Check the run:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::could not comment"
