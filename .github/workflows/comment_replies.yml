name: Comment replies

# Replies to viewers' YouTube comments in each channel's voice
# (scripts/reply_comments.py). The policy (which channels, how many, the
# voice) is `comments` in config/channel_registry.json. Each run is
# idempotent: a thread the channel already answered is skipped, so a
# missed slot is simply caught by the next one.
on:
  schedule:
    - cron: '20 14,19 * * *'
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'One channel (explainer, third, trending); empty = all'
        required: false
        default: ''
      dry_run:
        description: 'true = print the replies, post nothing'
        required: false
        default: 'false'

permissions:
  contents: write   # the saved comments (state/comments/) are committed

concurrency:
  group: comment-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -q google-api-python-client google-auth google-auth-oauthlib
      - name: Install Claude Code CLI (the brain that writes the replies)
        run: |
          command -v claude >/dev/null 2>&1 && exit 0
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 \
            || echo "::warning::claude CLI install failed"
      - name: Reply
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_EXPLAINER: ${{ secrets.YOUTUBE_TOKEN_JSON_EXPLAINER }}
          YOUTUBE_TOKEN_JSON_THIRD: ${{ secrets.YOUTUBE_TOKEN_JSON_THIRD }}
        run: |
          args=""
          [ -n "${{ inputs.channel }}" ] && args="--channel ${{ inputs.channel }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python scripts/reply_comments.py $args
      # READ ONLY: every channel's newest comments, saved where any session
      # can read them (operator, 2026-10-25: "all of our comments are, oh,
      # this is AI"). Needs no channel token, so it works while the reply
      # tokens lack youtube.force-ssl.
      - name: Save comments
        if: ${{ !cancelled() }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/reply_comments.py --save
      - name: Commit saved comments
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ci_commit_state.sh "comments: saved viewer comments [skip ci]" state/comments
