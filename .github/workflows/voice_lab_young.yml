# Voice lab round 4: younger, livelier narrators from GLOBE v2 (CC0).
# No secrets; read-only token; only collect writes, and only to this branch.
name: Voice lab young
on:
  push:
    branches: [voice-lab]
    paths: ['voice_lab/young_refs.py', 'voice_lab/gen_young.py', 'voice_lab/heard_young.py', '.github/workflows/voice_lab_young.yml']
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          mkdir globe
          B=https://huggingface.co/datasets/MushanW/GLOBE_V2/resolve/main/data
          for f in test-00000-of-00002 test-00001-of-00002 val-00000-of-00002 val-00001-of-00002 \
                   train-00000-of-00164 train-00001-of-00164 train-00002-of-00164 train-00003-of-00164; do
            curl -fsSL -o globe/$f.parquet $B/$f.parquet
          done
          sha256sum globe/* | tee globe.sha256
          pip install -q soundfile numpy librosa pyarrow
          python voice_lab/young_refs.py globe out
          cp globe.sha256 out/
      - uses: actions/upload-artifact@v4
        with: { name: young_refs, path: out/ }
  gen:
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: ['full 0/4', 'full 1/4', 'full 2/4', 'full 3/4', 'turbo 0/2', 'turbo 1/2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { name: young_refs, path: refs/ }
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 --extra-index-url https://download.pytorch.org/whl/cpu
          set -- ${{ matrix.job }}
          python voice_lab/gen_young.py refs out $1 $2
      - id: n
        run: echo "n=$(echo '${{ matrix.job }}' | tr ' /' '__')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'young_${{ steps.n.outputs.n }}', path: out/ }
  collect:
    needs: [refs, gen]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { path: dl/ }
      - run: |
          mkdir -p voice_lab/young
          find dl -type f \( -name '*.mp3' -o -name '*.txt' -o -name '*.json' -o -name '*.sha256' \) -exec cp {} voice_lab/young/ \;
          find dl -name 'globe_*.wav' -exec sh -c 'ffmpeg -y -loglevel error -i "$1" -ac 1 -c:a libopus -b:a 96k voice_lab/young/$(basename "$1" .wav).ogg' _ {} \;
          pip install -q openai-whisper
          python voice_lab/heard_young.py voice_lab/young || true
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add -f voice_lab/young
          git commit -m "voice lab young results [skip ci]" && git push origin HEAD:voice-lab
