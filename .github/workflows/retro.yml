name: Retro (daily self-review)

# Runs after the last publish slot (3:30pm Central) so every video of the day
# has real data. The review NEVER blocks production — it only reads.
#
# DST: GitHub crons are UTC-only, so 6:15pm Central is 23:15 UTC in summer and
# 00:15 UTC in winter. Firing one fixed UTC time would silently drift an hour
# twice a year — which is how the exchange's Phase B backstop nearly rendered
# pre-ChatGPT media for half the year. So we fire at BOTH candidate times and
# let an in-code America/Chicago check decide which one is really 6:15pm
# local. The wrong one exits immediately.
#
# TWO SEPARATE QUESTIONS, deliberately not conflated:
#
#   what GitHub BUILDS   always today's Chicago date, every night. A brief is
#                        a snapshot of a day; back-filling one would rewrite
#                        published evidence.
#   what ChatGPT REVIEWS the mailbox — the oldest brief with no proposals.
#                        A missed review stays reviewable without ever
#                        blocking or altering tomorrow's brief.
#
# A proposals push runs TRIAGE ONLY. No analytics refresh, no experiment
# advance, no brief rebuild, no rollup — all of those would move the evidence
# out from under the proposals that were just written against it.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Review date (YYYYMMDD). Blank = the mailbox decides.'
        required: false
        default: ''
      triage_only:
        description: 'Skip the brief; just triage existing proposals'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '15 23 * * *'   # 6:15pm Central during CDT
    - cron: '15 0 * * *'    # 6:15pm Central during CST
  push:
    branches: [main]
    paths:
      - 'retro/*/proposals.json'
      - 'retro/*/proposals/**'

permissions:
  contents: write
  issues: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: retro
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only one of the two scheduled runs is actually 6:15pm in Chicago.
      # Deciding in code rather than in cron is what makes this DST-safe.
      - name: Is it really evening in Chicago?
        id: when
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Chicago"))
          scheduled = os.environ.get("GITHUB_EVENT_NAME") == "schedule"
          ok = (not scheduled) or now.hour == 18
          print(f"go={'true' if ok else 'false'}")
          print(f"local={now:%Y-%m-%d %H:%M %Z}")
          # The review date is the Chicago calendar day being reviewed.
          print(f"today={now:%Y%m%d}")
          PY
          echo "chicago local time: $(grep local "$GITHUB_OUTPUT" | tail -1)"

      - name: Skip the duplicate DST run
        if: steps.when.outputs.go != 'true'
        run: |
          echo "::notice::Not 6:15pm in Chicago (${{ steps.when.outputs.local }})"
          echo "::notice::— this is the other DST cron. Exiting clean."

      - name: Resolve the review date
        id: d
        if: steps.when.outputs.go == 'true'
        env:
          EVENT: ${{ github.event_name }}
          EXPLICIT: ${{ inputs.date }}
        run: |
          set -e
          if [ -n "$EXPLICIT" ]; then
            DATE="$EXPLICIT"; WHY="explicit input"
          elif [ "$EVENT" = "push" ]; then
            # FROM THE PATH. Never today's UTC date — the proposals being
            # pushed belong to whatever folder they are in.
            DATE=$(git log -1 --name-only --pretty=format: \
                   | grep -oE 'retro/[0-9]{8}/' | head -1 | cut -d/ -f2 || true)
            WHY="derived from the changed proposals path"
          else
            # SCHEDULED RUNS ALWAYS BUILD TODAY'S CENTRAL DATE.
            #
            # This used to take the mailbox's oldest-unanswered date, which
            # conflated two different questions. The mailbox decides what
            # CHATGPT REVIEWS; it must never decide what GITHUB BUILDS.
            # Using it here meant one missed review stopped today's brief
            # from ever existing AND rewrote a published historical brief
            # with today's analytics — corrupting the evidence a reviewer
            # had already reasoned from.
            DATE="${{ steps.when.outputs.today }}"
            WHY="today in Chicago — the nightly brief is never a back-fill"
          fi
          [ -z "$DATE" ] && { echo "::error::could not resolve a review date"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "review date: $DATE ($WHY)"

      # Fresh numbers, best-effort. A stale brief is still worth building; a
      # failed analytics call must never stop the loop.
      - name: Refresh analytics
        # NOT on a proposals push: refreshing analytics and rebuilding the
        # brief would move the evidence out from under the proposals that
        # were just written against it.
        if: >-
          steps.when.outputs.go == 'true'
          && github.event_name != 'push'
          && inputs.triage_only != true
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 scripts/fetch_analytics.py --max-age-days 30 \
            || echo "::warning::analytics refresh failed — brief uses the last snapshot"

      # Recount every running experiment from the analytics BEFORE the brief,
      # so the brief reports true sample counts and flips anything whose
      # window has closed to readout_due.
      - name: Advance experiment sample counts
        if: steps.when.outputs.go == 'true' && github.event_name != 'push'
        continue-on-error: true
        run: python3 scripts/advance_experiments.py

      - name: Build the brief
        if: >-
          steps.when.outputs.go == 'true'
          && github.event_name != 'push'
          && inputs.triage_only != true
        continue-on-error: true
        run: python3 scripts/build_retro.py --date "${{ steps.d.outputs.date }}"

      - name: Triage proposals
        if: steps.when.outputs.go == 'true'
        continue-on-error: true
        run: python3 scripts/review_proposals.py --date "${{ steps.d.outputs.date }}"

      - name: Weekly rollup (Sundays)
        if: >-
          steps.when.outputs.go == 'true'
          && github.event_name != 'push'
          && inputs.triage_only != true
        continue-on-error: true
        run: |
          DOW=$(TZ=America/Chicago date +%u)
          if [ "$DOW" = "7" ]; then
            python3 scripts/weekly_rollup.py
          else
            echo "not Sunday in Chicago (day $DOW) — skipping the rollup"
          fi

      - name: Commit brief + triage + summary
        if: steps.when.outputs.go == 'true'
        run: |
          set -e
          D="${{ steps.d.outputs.date }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triage-only: commit the verdict files, never the brief or the
            # analytics that produced it.
            bash scripts/ci_commit_state.sh \
              "retro: triage for $D [skip ci]" \
              "retro/$D/triage.json" "retro/$D/triage.md" retro/state
          else
            bash scripts/ci_commit_state.sh \
              "retro: brief + triage for $D [skip ci]" \
              "retro/$D" retro/state state/analytics state/analytics_explainer \
              state/analytics_curiosity state/analytics_third
          fi

      - name: Post the executive summary
        if: >-
          steps.when.outputs.go == 'true'
          && github.event_name != 'push'
          && inputs.triage_only != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.REPORT_ISSUE_NUMBER || '1' }}
        run: |
          D="${{ steps.d.outputs.date }}"
          F="retro/$D/summary.md"
          [ -f "$F" ] || F="retro/$D/brief.md"
          [ -f "$F" ] && gh issue comment "$ISSUE" \
            --repo "${{ github.repository }}" --body-file "$F" \
            || echo "::warning::no summary to post"

      - name: What happens next
        if: steps.when.outputs.go == 'true'
        run: |
          echo "::notice::Mailbox:"
          python3 scripts/retro_mailbox.py || true
