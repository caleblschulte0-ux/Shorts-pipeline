name: Daily Shorts

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many shorts to publish (blank = live channel registry)'
        required: false
        default: ''
      force:
        description: 'Bypass 6-hour duplicate-trigger guard (--force-rerun, keeps pre-written packages)'
        required: false
        type: boolean
        default: false
      no_schedule:
        description: 'Publish all at once immediately (--no-schedule). Default OFF: the daily batch is SPACED across the day (2h apart) so 6 videos never dump at once. Check only for a one-off instant publish.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Render only, do NOT upload (--dry-run). For testing.'
        required: false
        type: boolean
        default: false
  # Auto-fire when the auto-merge workflow finishes a claude/* PR.
  # GitHub blocks GITHUB_TOKEN-attributed pushes from firing other
  # workflows (anti-recursion), so the push-paths trigger below never
  # fired after auto-merge. workflow_run on the merge workflow side-
  # steps that — daily.yml runs when auto-merge.yml completes
  # successfully, regardless of who attributed the resulting push.
  # RENDER HAND-OFF (exchange chain, 2026-07-30). This used to fire on
  # "Auto-merge claude PRs" — i.e. the moment the Routine's packages landed —
  # which now RACES the exchange: it would render with pre-ChatGPT media every
  # single day and silently defeat the whole point. Auto-merge now kicks
  # EXCHANGE PHASE A instead; this renders only once Phase B has finalized the
  # scripts and media. workflow_run (not push) because Phase B commits with
  # GITHUB_TOKEN and GitHub blocks those pushes from firing other workflows.
  # run_trending_daily's 6-hour dedupe guard makes a double-fire a safe no-op.
  #
  # THIS TRIGGER IS A FALLBACK, NOT THE ONLY ROUTE (2026-08-25, doctor
  # finding 2fc5cbb21cca). On 2026-08-23 exchange_phase_b.yml completed a
  # real, non-skipped apply and this workflow_run event never fired at all —
  # zero daily.yml runs that day, not even a skipped one. Phase B's own
  # "Hand off to render" step now explicitly dispatches this workflow
  # (workflow_dispatch) the moment a real apply commits, and fails its own
  # job loudly if GitHub does not accept that dispatch. Keep this
  # workflow_run trigger wired anyway — it is still a legitimate second path
  # in, and the phase_b_report.json preflight below makes either route safe.
  workflow_run:
    workflows:
      - "Exchange Phase B (consume ChatGPT, self-fill, ready to render)"
    types: [completed]
    branches: [main]
  # Belt-and-suspenders. If someone pushes packages directly to main
  # (bypassing the PR/auto-merge path), this picks it up. No-ops when
  # the orchestrator's "already posted today" check sees a fresh run.
  push:
    branches: [main]
    paths:
      # 'state/trending_packages/**' REMOVED 2026-07-30: a package push must
      # start EXCHANGE PHASE A (find media, ask ChatGPT), not a render.
      - '.github/triggers/daily'

permissions:
  contents: write   # commit posted_log + failure_count + reports
  issues: write     # post the daily report comment

env:
  PYTHON_VERSION: '3.11'
  # Number of the tracking issue the action comments on. Created once;
  # update via repo variable REPORT_ISSUE_NUMBER if needed.
  REPORT_ISSUE_NUMBER: ${{ vars.REPORT_ISSUE_NUMBER || '1' }}

jobs:
  daily:
    # Added by ChatGPT 2026-08-02: a failed Phase B is not a render manifest.
    # Manual/trigger-file rescues still run, but workflow_run only advances on
    # a successful deterministic handoff.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: daily-shorts
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Pre-flight — kill switch + failure counter
        id: preflight
        run: |
          set -e
          # A COMPLETED PHASE B RUN IS NOT THE SAME THING AS A FINISHED DAY.
          #
          # exchange_phase_b.yml fires on TWO candidate UTC hours so the code
          # can pick the one that lands at 08:30 America/Chicago in either
          # DST half (see that workflow's header). The OTHER candidate hour
          # is a deliberate no-op: `backstop_status()` says the finalizer's
          # window hasn't opened yet, `exchange_phase_b.py --backstop`
          # returns 0 having applied nothing, and every step in that job
          # still exits clean — so the workflow's conclusion is `success`
          # with nothing actually applied. This job's own `if:` only checks
          # `github.event.workflow_run.conclusion == 'success'`, which
          # cannot tell that benign no-op apart from a real completed
          # handoff — so in winter (13:30 UTC = 07:30 CST, an hour before
          # the finalizer's window even closes) it would start rendering an
          # unfinished day: no self-fill, no punch-up, most media missing,
          # every check green (doctor finding 612efa85efcb, 2026-08-16).
          #
          # `exchange/bundles/<date>/phase_b_report.json` is written ONLY at
          # the tail of a real Phase B application (scripts/exchange_phase_b.py,
          # after self-fill + punch-up + package writes) — never on the
          # early no-op path. Its presence for TODAY is the actual "ready to
          # render" fact; the upstream conclusion alone is not.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            D=$(date -u +%Y%m%d)
            if [ ! -f "exchange/bundles/$D/phase_b_report.json" ]; then
              echo "skip=phase_b_incomplete" >> $GITHUB_OUTPUT
              echo "Phase B's workflow completed but exchange/bundles/$D/phase_b_report.json does not exist yet — this was the OTHER scheduled candidate (its window hasn't opened / nothing applied), not a real handoff. Not rendering; the correct candidate or the DONE push will fire this properly."
              exit 0
            fi
          fi
          # PAUSED = global kill switch (all channels). PAUSED_DAILY = pause
          # ONLY this trending channel (operator ruling 2026-07-11: keep
          # trending down for the distribution diagnosis while the other
          # channels resume). Either file skips the daily run.
          if [ -f PAUSED ] || [ -f PAUSED_DAILY ]; then
            echo "skip=manual" >> $GITHUB_OUTPUT
            echo "Daily paused: PAUSED or PAUSED_DAILY file exists in repo root."
            exit 0
          fi
          fc=$(cat state/failure_count.txt 2>/dev/null | tr -d '[:space:]' || echo 0)
          echo "Failure count: $fc"
          # AUTO-PAUSE IS A BACKOFF, NOT A LATCH. It used to skip forever
          # until a human reset the counter by hand — the exact opposite of
          # the operator's standing ruling ("if something doesn't run
          # properly, it goes through and tries again"), and a two-day
          # external outage (YouTube API, a runner image break) would have
          # parked the channel permanently on a box nobody was watching.
          #
          # Now: two zero-upload days -> sit out ONE day (that still
          # protects quota and render minutes against a systematically
          # broken pipeline) -> retry automatically. A retry that fails
          # again earns another day off; one that works resets to 0. The
          # channel can degrade to every-other-day, never to never. The
          # alarm's `channel_auto_paused` critical still fires on every
          # paused day, so a real breakage is loud while it self-retries.
          if [ "$fc" -ge 2 ]; then
            TODAY=$(date -u +%Y%m%d)
            SAT_OUT=$(cat state/auto_pause_day.txt 2>/dev/null | tr -d '[:space:]' || echo 0)
            if [ "$SAT_OUT" -ge "$TODAY" ]; then
              # already sitting out this day — a re-fire stays skipped
              echo "skip=auto" >> $GITHUB_OUTPUT
              echo "::error::TRENDING IS PAUSED for $TODAY (2 zero-upload days). Retrying automatically tomorrow."
            elif [ "$SAT_OUT" -gt 0 ]; then
              # sat out a full day — retry now
              echo "1" > state/failure_count.txt
              rm -f state/auto_pause_day.txt
              # A REJECTED/FAILED PERSIST MUST NOT BE TREATED AS A DURABLE
              # RESUME. `|| true` here used to swallow a push failure: the
              # runner's local failure_count.txt/auto_pause_day.txt changed,
              # but main kept the STALE state, while this step still emitted
              # skip= and a warning as if the resume had landed. The next
              # firing would then read that stale committed state off main
              # and could repeat the wrong branch, defeating the one-day
              # pause/auto-retry guarantee (doctor finding cc8333959d84).
              # ci_commit_state.sh already exits non-zero on a real persist
              # failure (5-attempt push retry exhausted, or a commit
              # failure) — surface that as a named infra failure instead of
              # continuing past it.
              if ! bash scripts/ci_commit_state.sh \
                    "trending: auto-resume after a paused day [skip ci]" \
                    state/failure_count.txt state/auto_pause_day.txt; then
                echo "::error::AUTO-PAUSE STATE PERSIST FAILED — could not commit the auto-resume (failure_count.txt reset to 1, auto_pause_day.txt cleared) to main. Refusing to claim a durable resume; failing this run so the infra fault is visible instead of the next run silently repeating today's decision against stale state. Re-run once the push failure (see ci_commit_state.sh output above) is fixed."
                exit 1
              fi
              echo "skip=" >> $GITHUB_OUTPUT
              echo "::warning::AUTO-RESUME: sat out $SAT_OUT, retrying today. Another zero-upload day pauses again tomorrow."
            else
              # first paused day — record it so tomorrow's run can retry
              echo "$TODAY" > state/auto_pause_day.txt
              # Same fail-closed rule as the resume branch above: a state
              # commit that never reached main is not a durable pause record,
              # so a persist failure here must not be swallowed either —
              # the next run would see no auto_pause_day.txt on main and
              # re-derive "first paused day" every single day instead of
              # ever reaching the auto-resume branch.
              if ! bash scripts/ci_commit_state.sh \
                    "trending: auto-pause day $TODAY recorded [skip ci]" \
                    state/auto_pause_day.txt; then
                echo "::error::AUTO-PAUSE STATE PERSIST FAILED — could not commit auto_pause_day.txt=$TODAY to main. Refusing to claim a durable pause; failing this run so the infra fault is visible instead of tomorrow's run silently re-deciding against stale/absent state. Re-run once the push failure (see ci_commit_state.sh output above) is fixed."
                exit 1
              fi
              echo "skip=auto" >> $GITHUB_OUTPUT
              echo "::error::TRENDING IS PAUSED for $TODAY (state/failure_count.txt=$fc). It will retry ITSELF tomorrow — no manual reset needed. To retry sooner: echo 0 > state/failure_count.txt && git commit -am 'resume trending' && git push"
            fi
          else
            echo "skip=" >> $GITHUB_OUTPUT
          fi

      - name: Notify (skipped run)
        # phase_b_incomplete is the OTHER scheduled Phase B candidate no-op'ing
        # — expected roughly once a day for half of every year (see
        # preflight), not a fault. Alerting on it daily is how people learn to
        # ignore the channel.
        if: steps.preflight.outputs.skip != '' && steps.preflight.outputs.skip != 'phase_b_incomplete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SKIP_REASON: ${{ steps.preflight.outputs.skip }}
        run: |
          if [ "$SKIP_REASON" = "manual" ]; then
            REASON="manual pause (PAUSED file present in repo root)"
          else
            REASON="auto-pause (2 zero-upload days in a row — sitting out today, retrying itself tomorrow)"
          fi
          MSG="Daily shorts run SKIPPED — $REASON. Manual pause: remove the PAUSED file. Auto-pause: no action needed (it retries tomorrow); to retry sooner reset state/failure_count.txt to 0."
          gh issue comment "$REPORT_ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "$MSG"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" \
                 -H "Title: Daily Shorts Paused" \
                 -H "Tags: pause_button"
          fi

      - name: Stop here if skipped
        if: steps.preflight.outputs.skip != ''
        run: |
          # A SKIPPED RUN MUST NOT LOOK LIKE A WORKING ONE.
          #
          # This was `exit 0`. On 2026-08-03 the auto-pause tripped and, for
          # three days, this job skipped the orchestrator and reported
          # SUCCESS — a green check on a channel that shipped nothing. That
          # is the exact failure shape this repo keeps re-learning: the step
          # succeeded at the wrong thing.
          #
          # An AUTO-pause is a fault that needs a human, so the run goes RED.
          # A MANUAL pause (the PAUSED / PAUSED_DAILY files) is a deliberate
          # operator choice, so it stays green — being told off daily for a
          # decision you made on purpose is how people learn to ignore red.
          if [ "${{ steps.preflight.outputs.skip }}" = "auto" ]; then
            echo "::error::auto-paused — failing the run so it is not a green check on a dead channel"
            exit 1
          fi
          if [ "${{ steps.preflight.outputs.skip }}" = "phase_b_incomplete" ]; then
            echo "::notice::Phase B's other scheduled candidate hasn't applied yet — staying green, not rendering"
            exit 0
          fi
          echo "::notice::manually paused on purpose — staying green"
          exit 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system deps
        run: |
          # The hosted runner ships a Microsoft apt repo whose signing key
          # intermittently breaks ("no longer signed"), failing apt-get update
          # with exit 100. We don't need it — drop it, tolerate residual update
          # errors, then install ffmpeg from the Ubuntu repos.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
                     /etc/apt/sources.list.d/*microsoft* 2>/dev/null || true
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y -q ffmpeg

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare showrunner judge
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # ChatGPT 2026-08-02: authoring was removed from this render job,
          # but the showrunner may still use the subscription-backed Claude
          # CLI as its vision judge. Install it only for that gate; Gemini is
          # the independent fallback.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          fi
          if ! command -v claude >/dev/null 2>&1 && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::no showrunner judge available (Claude CLI install failed and GEMINI_API_KEY is empty)"
            exit 1
          fi

      - name: Cache Kokoro TTS models (~350MB)
        id: cache-kokoro
        uses: actions/cache@v4
        with:
          path: kokoro_models/
          key: kokoro-onnx-v1.0
          restore-keys: |
            kokoro-onnx-

      - name: Download Kokoro TTS models if cache miss
        if: steps.cache-kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro_models
          curl -fsSL -o kokoro_models/kokoro-v1.0.onnx \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          curl -fsSL -o kokoro_models/voices-v1.0.bin \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          ls -lh kokoro_models/

      # Gameplay clips are large (50MB+) and totally static — cache
      # them so the daily run doesn't re-download from archive.org
      # every morning. The cache key matches whatever the current
      # seed_gameplay.py SEEDS list hashes to, so swapping a clip
      # invalidates automatically.
      - name: Cache gameplay clips
        id: cache-gameplay
        uses: actions/cache@v4
        with:
          path: gameplay/
          key: gameplay-${{ hashFiles('seed_gameplay.py') }}
          restore-keys: |
            gameplay-

      # Persistent media caches (audit Tickets 3/4/5): stock footage, AI-
      # generated images, and translations survive between runs instead of
      # re-downloading/regenerating daily. run_id key + restore-keys prefix
      # = the standard evolving-cache pattern (restore newest, save updated).
      - name: Cache media + translations
        uses: actions/cache@v4
        with:
          path: |
            cache/stock_video/
            cache/gen_images/
            cache/translation/
            cache/funnel/
          key: media-cache-v1-${{ github.run_id }}
          restore-keys: |
            media-cache-v1-

      - name: Seed gameplay clips
        run: |
          python seed_gameplay.py

      - name: Verify required secrets are set
        env:
          YT_CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY: ${{ secrets.PIXABAY_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          [ -z "$YT_CLIENT" ] && { echo "::error::missing secret YOUTUBE_CLIENT_SECRETS_JSON"; missing=1; }
          [ -z "$YT_TOKEN" ] && { echo "::error::missing secret YOUTUBE_TOKEN_JSON"; missing=1; }
          [ -z "$PEXELS" ] && { echo "::error::missing secret PEXELS_API_KEY"; missing=1; }
          [ -z "$PIXABAY" ] && { echo "::error::missing secret PIXABAY_API_KEY"; missing=1; }
          # THE SHOWRUNNER NOW GATES THIS CHANNEL, AND IT FAILS CLOSED.
          # With no vision judge available every video is HELD, so the run
          # would render six shorts over ~40 minutes and publish none of
          # them. Checking here turns that into an immediate, named failure
          # instead of a silent zero-post day. This is a check being ADDED,
          # never a way to skip the gate — there is no bypass, only a
          # clearer reason.
          if ! command -v claude >/dev/null 2>&1 && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::no vision judge available (need an installed authenticated Claude CLI, or GEMINI_API_KEY as fallback)."
            echo "::error::The showrunner gates this channel and fails closed, so every video would be held."
            missing=1
          fi
          [ $missing -ne 0 ] && exit 1
          echo "Secrets present."

      # ChatGPT 2026-08-02: this workflow is a renderer/uploader, never a
      # fallback brain. Claude's normal authoring happens before Phase A;
      # ChatGPT owns a Claude-out day before Phase B. Re-authoring here hid
      # broken handoffs and made "render" a second, conflicting source of
      # content policy.

      - name: Run daily orchestrator
        id: run
        # Gate on the kill switch: without this the orchestrator uploaded even
        # while PAUSED_DAILY / auto-pause were set, and because the logging
        # step IS gated the post never got recorded (re-post risk). Now a
        # paused run uploads nothing, so upload and logging stay in lockstep.
        if: steps.preflight.outputs.skip == ''
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          # Per-channel tokens. Each one corresponds to a channel slug
          # that packages can set via the `channel` field. Empty/missing
          # in the package routes to the default (YOUTUBE_TOKEN_JSON).
          # Add a new line per new channel; secrets that aren't set in
          # the repo just become empty strings and the orchestrator's
          # error message tells you which one is missing.
          YOUTUBE_TOKEN_JSON_EXPLAINER: ${{ secrets.YOUTUBE_TOKEN_JSON_EXPLAINER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # THE SHOWRUNNER. This channel ships 6 videos a day and, until now,
          # nothing watched any of them (docs/SYSTEM_AUDIT.md §D). The gate
          # judges on the headless-Claude SUBSCRIPTION via this token — the
          # Claude subscription credential when available — never the paid
          # API. Without it the gate falls back to Gemini
          # below; with neither, the preflight has already failed the run.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Gemini: the showrunner's only fallback judge, plus the optional
          # assists — custom thumbnails, shot image backfill (free image
          # models only), and vision QA on the finished video.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Media-funnel expansion secrets (doctrine M4/M7): every one is
          # optional — its provider stays silent until the secret exists.
          SMITHSONIAN_KEY: ${{ secrets.SMITHSONIAN_KEY }}
          EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
          NPS_KEY: ${{ secrets.NPS_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional: when set, topic_video pulls from Vimeo's CC pool
          # alongside Commons / NASA / Archive / news embeds. Skips
          # silently if unset, so this isn't in the required-secrets
          # preflight check above.
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          # Optional: enables topic_video Source 5 — YouTube Data API
          # search.list?videoLicense=creativeCommon. CC-BY clips are
          # explicitly licensed for commercial reuse; Content ID does
          # not strike on creator-opted-in CC matches. ~100 quota units
          # per call, well within the 10K daily limit. Skips silently
          # if unset.
          #
          # Separate from YOUTUBE_TOKEN_JSON above: that's the OAuth
          # token for uploading. This is a server API key for reading
          # the public catalog. Create at
          # https://console.cloud.google.com/apis/credentials.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Optional: when set, topic_video pulls from DVIDS
          # (Defense Visual Information Distribution Service) for
          # federal-PD video footage — Coast Guard rescues, hurricane
          # response, NATO exercises, White House press pool. All
          # 17 U.S.C. § 105 public domain, zero copyright risk. Free
          # registration at https://www.dvidshub.net/api/. Skips
          # silently if unset.
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          # News-image funnel keys (funnel/media_funnel.py). All free tiers,
          # all no-credit-card required. Each provider skips silently
          # if its secret is unset, so the render still works without
          # them — but the relevance gate will start failing renders
          # whose imagery falls through to generic stock, so the
          # daily output stays gated by the funnel's coverage.
          # Sign up:
          #   https://newsapi.org/register
          #   https://gnews.io/  (free dev tier)
          #   https://brave.com/search/api/  (free 2k/mo)
          #   https://tavily.com/  (free 1k/mo)
          #   https://newsdata.io/register
          #   https://api.imgur.com/oauth2/addclient  (anonymous app)
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          BRAVE_KEY: ${{ secrets.BRAVE_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          # Opt-in: when set to "1", topic_video Source 8 pulls trending
          # video from YouTube WITHOUT the CC license filter — relying on
          # fair-use commentary doctrine. Read as a repo Variable (not a
          # Secret) since it's just an on/off flag. Set at:
          # https://github.com/caleblschulte0-ux/Shorts-pipeline/settings/variables/actions
          # Off = empty string; the topic_video code checks for == "1".
          # YouTube Content ID is automated and can demonetize / strike
          # broadcaster clips; our pipeline's transformation (TTS voice
          # over, stacked layout, captions, 2-second sub-cuts) is the
          # fair-use defense.
          TOPIC_VIDEO_ALLOW_STRIKES: ${{ vars.TOPIC_VIDEO_ALLOW_STRIKES }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_adam' }}
          COUNT: ${{ github.event.inputs.count }}
          FORCE: ${{ github.event.inputs.force }}
          # Default to immediate publish for EVERY trigger (dispatch, push,
          # workflow_run). On non-dispatch triggers inputs.* is empty, so the
          # `|| 'true'` makes those publish immediately too. A human can still
          # dispatch with the box unchecked ('false') to schedule.
          NO_SCHEDULE: ${{ github.event.inputs.no_schedule || 'true' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # An empty count means "whatever the registry says" — the mix and
          # the total live in config/channel_registry.json, not here.
          if [ -z "$COUNT" ]; then
            COUNT=$(python3 -c "from shared import channel_registry as r; print(r.target_count('trending'))") || {
              echo "::error::channel registry unusable — refusing to guess a slate size"; exit 1; }
            echo "count from the registry: $COUNT"
          fi
          # ChatGPT 2026-08-02: Phase B is the only production admission
          # gate. The renderer must refuse an incomplete manifest instead of
          # reaching backward for stale packages or becoming a Groq brain.
          ARGS="--count $COUNT --require-manifest"
          # The trigger file is the operator/supervisor's explicit repair
          # mechanism. It must resume the unposted remainder even when one
          # package succeeded in the last six hours; posted-title dedupe still
          # prevents that successful package from being uploaded twice.
          if [ "$FORCE" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ARGS="$ARGS --force-rerun"
          fi
          # Publish IMMEDIATELY by default (operator ruling): the daily video
          # goes public the moment it renders. Only schedule if explicitly
          # asked via a manual dispatch with the box unchecked (NO_SCHEDULE
          # resolves to the literal 'false').
          # Default = SPACED scheduling (drip 6 across the day). Only skip
          # scheduling for an explicit one-off instant publish.
          if [ "$NO_SCHEDULE" = "true" ]; then ARGS="$ARGS --no-schedule"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Running: python scripts/run_trending_daily.py $ARGS"
          python scripts/run_trending_daily.py $ARGS

      # Dry-run only: keep the rendered mp4s as a downloadable artifact so a
      # full composited video can be reviewed without uploading anywhere.
      - name: Upload rendered videos (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-videos
          path: output/*.mp4
          retention-days: 5
          if-no-files-found: warn

      - name: Update failure counter
        if: always() && steps.preflight.outputs.skip == ''
        env:
          # the policy script reads the orchestrator outcome from env rather
          # than an inlined ${{ }} so the tests can execute it with either
          # value directly
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          # WHAT COUNTS AS "FAILURE" IS POLICY, NOT PLUMBING — and policy
          # has to be executable to be testable. The RED-vs-PAUSED decision
          # (the run stays red on any shortfall for visibility; the counter
          # bumps ONLY on a zero-upload day, so the showrunner holding a
          # video never feeds auto-pause) lives with its full rationale in
          # scripts/daily_failure_counter.sh, which
          # tests/test_production_outcome.py RUNS against real outcome files
          # instead of grepping this workflow (doctor finding 9943424b8251).
          bash scripts/daily_failure_counter.sh

      - name: Fetch analytics snapshot
        # Pulls views/likes/comments for every uploaded video in the last
        # 30 days, writes state/analytics/<today>.json + latest.json.
        # Tomorrow's routine reads latest.json to learn what's working.
        # Costs ~5 quota units (vs 9.6K for uploads), safe against the
        # 10K daily limit. Skipped on a failed orchestrator run since
        # the new uploads wouldn't be queryable yet.
        if: steps.preflight.outputs.skip == '' && steps.run.outcome == 'success'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 scripts/fetch_analytics.py --max-age-days 30

      - name: Format scoreboard (A/B/C rollup)
        # Joins packages (title->format) with the fresh analytics snapshot
        # and appends the per-format table to today's report, so the
        # tracking issue shows which format is winning. Best-effort.
        if: steps.preflight.outputs.skip == '' && steps.run.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/format_scoreboard.py || exit 0
          if [ -f daily_report.md ] && [ -f state/format_scoreboard.md ]; then
            { echo ""; cat state/format_scoreboard.md; } >> daily_report.md
          fi

      - name: Roll up aged state (audit Ticket 6)
        if: always() && steps.preflight.outputs.skip == ''
        # Folds analytics dailies + package day-dirs older than 90 days into
        # monthly rollups (data preserved, file count bounded). No-ops until
        # anything is actually that old. Never touches posted logs.
        run: python3 scripts/rollup_state.py --max-age-days 90 || echo "::warning::rollup skipped"

      - name: Commit log + counter + report
        if: always() && steps.preflight.outputs.skip == ''
        env:
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
        run: |
          # Shared hardened persist (audit Ticket 1): retry loop + backup/
          # restore of our artifacts + UNION-MERGE of every posted-log on a
          # push race, so no dedupe entry from either side is ever lost.
          # [skip ci] is LOAD-BEARING here, not tidiness: this blanket
          # `state/` add includes any package `run_one` wrote during a
          # backfill (state/trending_packages/<ts>_auto_*.json), and
          # state/trending_packages/** is a PUSH TRIGGER for Phase A.
          # Without it, every day with a re-authored slot pokes Phase A
          # back awake AFTER the day rendered.
          bash scripts/ci_commit_state.sh \
            "daily: $(date -u +%Y-%m-%d) report + state [skip ci]" \
            state/ daily_report.md daily_report.json

      - name: Post report to tracking issue
        if: always() && steps.preflight.outputs.skip == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f daily_report.md ]; then
            gh issue comment "$REPORT_ISSUE_NUMBER" \
              --repo "${{ github.repository }}" \
              --body-file daily_report.md
          else
            gh issue comment "$REPORT_ISSUE_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "Daily run did not produce a report. Check the action logs."
          fi

      - name: Push notification via ntfy
        if: always() && steps.preflight.outputs.skip == ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC not set — skipping ntfy push."
            exit 0
          fi
          if [ "$RUN_OUTCOME" = "success" ]; then
            TITLE="Daily shorts posted"
            TAG="white_check_mark"
          else
            TITLE="Daily shorts FAILED"
            TAG="rotating_light"
          fi
          # First ~12 lines of the report = headline + per-post lines
          MSG=$(head -20 daily_report.md 2>/dev/null || echo "no report")
          curl -fsS -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" \
               -H "Title: $TITLE" \
               -H "Tags: $TAG" \
               -H "Click: https://github.com/${{ github.repository }}/issues/$REPORT_ISSUE_NUMBER"

      - name: Reflect orchestrator result
        if: steps.preflight.outputs.skip == ''
        run: |
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            exit 1
          fi
