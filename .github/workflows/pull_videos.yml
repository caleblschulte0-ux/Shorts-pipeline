name: Pull Videos

# One-shot: yank scheduled videos by id (used when a video shouldn't
# publish). Deletes, or with mode=unschedule only sets it private with no
# publish time (reversible in Studio); prints a Studio link if the token
# lacks the scope for either.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Space-separated YouTube video IDs to pull'
        required: true
        default: ''
      channel:
        description: 'Which channel token'
        required: false
        default: 'explainer'
        type: choice
        options: [explainer, third, trending]
      mode:
        description: 'delete, or unschedule (private, reversible)'
        required: false
        default: 'unschedule'
        type: choice
        options: [unschedule, delete]

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib
      - name: Pull videos
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_EXPLAINER: ${{ secrets.YOUTUBE_TOKEN_JSON_EXPLAINER }}
          YOUTUBE_TOKEN_JSON_THIRD: ${{ secrets.YOUTUBE_TOKEN_JSON_THIRD }}
          CHANNEL: ${{ github.event.inputs.channel }}
          MODE: ${{ github.event.inputs.mode }}
          IDS: ${{ github.event.inputs.ids }}
        run: |
          flag=""; [ "$MODE" = "unschedule" ] && flag="--unschedule"
          ch="${CHANNEL:-explainer}"; [ "$ch" = trending ] && ch=""   # trending's token has no suffix
          python scripts/pull_videos.py --channel "$ch" $flag $IDS
