name: Story Forge (keep the queue full of REAL stories)

# The channel's supply line. The queue used to run dry because the only way to
# refill it was an LLM inventing numbers — which the editorial gate refuses to
# publish, so a "full" queue still shipped nothing.
#
# This job goes and GETS data instead: live World Bank (WDI) indicators
# discovered from the catalogue at run time, written with honest provenance
# (publisher, url, access_date, officiality=official), composed into stories
# whose WORDS are written by the brain and whose NUMBERS come only from the
# source. Every forged story must clear the editorial gate (real data +
# premise bar), actually build, and not duplicate anything already covered.
#
# Runs on a schedule so there is always material to post, and can be fired by
# hand when the queue needs a push.

on:
  schedule:
    - cron: '20 5,17 * * *'      # twice daily, ahead of the posting windows
  workflow_dispatch:
    inputs:
      top_up:
        description: 'keep at least this many un-posted stories'
        required: false
        default: '10'
      count:
        description: 'force exactly N new stories (overrides top_up when set)'
        required: false
        default: ''
      predraw_stories:
        description: 'draw (or re-judge) scenes for this many stories ahead of posting'
        required: false
        default: '3'
      predraw_minutes:
        description: 'minutes the drawing brain may spend'
        required: false
        default: '35'

permissions:
  contents: write

concurrency:
  group: story-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pre-flight — kill switch
        run: |
          if [ -f PAUSED ]; then echo "Pipeline paused (PAUSED file)."; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System libs
        run: |
          # The hosted runner ships a Microsoft apt repo whose signing key
          # intermittently breaks; drop it so apt-get update cannot fail on it.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list                      /etc/apt/sources.list.d/*microsoft* 2>/dev/null || true
          sudo apt-get update -qq || sudo apt-get update -qq || true
          # libcairo2-dev + pkg-config: build deps of pycairo, which
          # data_learning/requirements.txt has pulled in since #432. Without
          # them pip's metadata build for pycairo fails and the whole install
          # dies before a single story is forged (every run since 2026-09-23).
          sudo apt-get install -y -q libcairo2-dev pkg-config

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r data_learning/requirements.txt

      - name: Forge stories from live open data
        env:
          # The brain writes the WORDS only. If no key is reachable the forge
          # falls back to deterministic copy — it never invents a number either
          # way, so the datasets stay citable.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          COUNT="${{ inputs.count }}"
          TOPUP="${{ inputs.top_up }}"; [ -z "$TOPUP" ] && TOPUP="10"
          if [ -n "$COUNT" ]; then
            python3 scripts/story_forge.py --count "$COUNT"
          else
            python3 scripts/story_forge.py --top-up "$TOPUP"
          fi

      - name: Install Claude Code CLI (the brain that draws the new look)
        run: |
          command -v claude >/dev/null 2>&1 && { echo "claude CLI present"; exit 0; }
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 \
            && echo "claude CLI installed" \
            || echo "::warning::claude CLI install failed"

      - name: Draw the next new-look stories ahead of the posting run
        # The A/B split is two illustrated videos a day, and one renders in
        # that look only when every beat has a verified scene. Drawn only
        # inside the posting render, none made it from 2026-10-05 to
        # 2026-10-07 (scripts/predraw_scenes.py). Same verifier, its own clock;
        # each verified scene is saved the moment it passes. Best-effort: a
        # missing brain or a spent budget leaves the renderer to try as before.
        continue-on-error: true
        timeout-minutes: 150
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — nothing can be drawn ahead"
            exit 0
          fi
          python3 scripts/predraw_scenes.py --stories "${{ inputs.predraw_stories || 3 }}" --budget-min "${{ inputs.predraw_minutes || 35 }}"

      - name: Show what the editorial gate makes of the queue
        run: python3 scripts/editorial_gate.py 2>&1 | tail -20

      - name: Commit the new stories + datasets
        run: |
          bash scripts/ci_commit_state.sh \
            "story forge: new real-data stories [skip ci]" \
            data_learning/niche.config.json data_learning/data \
            state/forge_used.json
