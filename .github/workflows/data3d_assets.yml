name: Data 3D assets (fetch CC0 models and skies to the data3d-assets branch)

# Poly Haven (CC0) is refused by the Claude workspace's proxy but reachable from runners. A push of
# .github/triggers/data3d_assets fetches what it lists (tools/data3d/assets/fetch.py) and commits it to the orphan
# branch data3d-assets. Nothing here touches main or posts anything.
on:
  push:
    branches: ['claude/data3d-video2']
    paths: ['.github/triggers/data3d_assets']

permissions:
  contents: write   # the data3d-assets branch only

concurrency:
  group: data3d-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 1}
      - name: fetch
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          git fetch --depth=1 origin data3d-assets && git worktree add "$RUNNER_TEMP/assets" origin/data3d-assets \
            || { git worktree add --detach "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets" && git checkout --orphan data3d-assets && git rm -rqf . ; cd -; }
          python3 tools/data3d/assets/fetch.py .github/triggers/data3d_assets "$RUNNER_TEMP/assets"
      - name: commit
        run: |
          cd "$RUNNER_TEMP/assets"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "data3d assets: $(head -c 200 "$GITHUB_WORKSPACE/.github/triggers/data3d_assets" | tr '\n' ' ')"
          for i in 1 2 3 4; do git push origin HEAD:refs/heads/data3d-assets && break; sleep $((i*5)); git pull --rebase origin data3d-assets || true; done
