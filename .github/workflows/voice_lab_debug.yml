# Debug the round-9 ref finder on a small corpus and commit its log.
name: Voice lab debug
on:
  push:
    branches: [voice-lab]
    paths: ['.github/workflows/voice_lab_debug.yml']
permissions:
  contents: write
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - shell: bash
        run: |
          mkdir -p corpus voice_lab/debug; L=voice_lab/debug/log.txt
          curl -fsL https://www.openslr.org/resources/141/dev_clean.tar.gz | tar -xz -C corpus
          find corpus -maxdepth 3 | head -20 >> $L
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q soundfile numpy librosa pyarrow speechbrain==1.0.3 "huggingface_hub<0.26"
          timeout 1500 python voice_lab/clean_refs.py libritts corpus out voice_lab >> $L 2>&1; echo "exit $?" >> $L
          tail -c 20000 $L > $L.t; mv $L.t $L
          git config user.name voice-lab; git config user.email voice-lab@users.noreply.github.com
          git add -f voice_lab/debug; git commit -qm "voice lab debug log [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin voice-lab && git push origin HEAD:voice-lab && break; sleep $((i*3)); done
