name: Data 3D short - SHIP at the deadline (render the best take in full, assemble; no upload)

# The way out of the judge loop (tools/data3d/daily/ship.py, 2026-11-28). data3d_render.yml renders a short only when
# every shot has passed the panel, and nothing in it ever gives up: the lava short spent 90 hours there. The operator's
# rule is two or three rounds a shot, then the video is made. This workflow is that rule:
#
#   - it runs only for a story ship.py says may ship: every shot has passed the panel once or has been judged
#     ship.CAP (3) times, or the story was born in the daily pipeline ("pipeline": "daily"), which bounds its own looks;
#   - it renders every shot at the code as it stands, with the measured checks REPORTING (STAGING=on, CLIPPING=report):
#     what they find is in the log, and they stop nothing. Only a shot that does not build stops the run;
#   - the finished mp4, its sheet, render metadata and the showrunner's PREVIEW verdict go to preview-renders under
#     data3d/<story>/, exactly as data3d_render.yml puts them. Nothing here posts anywhere: posting is
#     data3d_upload.yml on main, where the showrunner gate judges the cut again and is not changed by any of this.
#
# .github/triggers/data3d_ship:  story=<folder>
#   narration_run=<run id>   reuse that run's voice (omit to voice it here)
#   spp=<n>  pct=<n>         render quality (default 32 spp, 100%)
#   fresh=1 | reshoot=3 4    as data3d_render.yml: copy nothing / render these shots whatever their key
on:
  push:
    branches: ['claude/data3d-video2', 'claude/data3d-daily']
    paths: ['.github/triggers/data3d_ship']

permissions:
  contents: write   # preview-renders only
  actions: read     # the narration artifact of an earlier run

concurrency:
  group: data3d-ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cfg:
    runs-on: ubuntu-latest
    outputs:
      story: ${{ steps.c.outputs.story }}
      shots: ${{ steps.c.outputs.shots }}
      narr_run: ${{ steps.c.outputs.narr_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 1}
      - id: c
        run: |
          cfg=.github/triggers/data3d_ship
          story=$(sed -n 's/^story=//p' $cfg); story=$(printf %s "$story" | tr -cd 'a-z0-9_')
          test -f tools/data3d/stories/$story/script.json || { echo "::error::no story folder tools/data3d/stories/$story"; exit 1; }
          python3 tools/data3d/daily/ship.py check "$story" || { echo "::error::$story may not ship yet (tools/data3d/daily/ship.py): judge it with data3d_board.yml / data3d_render.yml first"; exit 1; }
          echo "story=$story" >> $GITHUB_OUTPUT
          echo "shots=$(python3 -c "import json;print(json.dumps(list(range(1,len(json.load(open('tools/data3d/stories/$story/script.json'))['lines'])+1))))")" >> $GITHUB_OUTPUT
          run=$(sed -n 's/^narration_run=//p' $cfg)
          echo "narr_run=${run:-${{ github.run_id }}}" >> $GITHUB_OUTPUT
          echo "story $story, voice from run ${run:-this one}"

  narrate:
    needs: cfg
    if: needs.cfg.outputs.narr_run == github.run_id   # a trigger naming narration_run reuses that voice
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 1, path: branch}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: main, fetch-depth: 1, path: main}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - name: Deps
        working-directory: main
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config
          pip install -q -r requirements.txt -r data_learning/requirements.txt
      - name: Cache narration lines
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: main/cache/tts/
          key: tts-lines-v1-${{ github.run_id }}
          restore-keys: |
            tts-lines-v1-
      - name: Voice the lines
        working-directory: main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Charon' }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          SPEECHIFY_VOICE: ${{ vars.SPEECHIFY_VOICE || 'henry' }}
          SPEECHIFY_MODEL: ${{ vars.SPEECHIFY_MODEL || 'simba-3.2' }}
          TTS_CACHE_DIR: cache/tts
        run: |
          mkdir -p ../narr
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.'); sys.path.insert(0, 'data_learning')
          import studio_render as sr
          s = json.load(open('../branch/tools/data3d/stories/${{ needs.cfg.outputs.story }}/script.json'))
          nar, win = sr.synth_narration(s['lines'], Path('../narr').resolve(), s.get('voice', 'am_fenrir'))
          json.dump({'slug': s['slug'], 'lines': s['lines'], 'windows': win, 'tts': sr.TTS_USED},
                    open('../narr/narration.json', 'w'), indent=1)
          print('NARRATION', json.dumps(sr.TTS_USED), win)
          if sr.TTS_USED.get('engine') == 'kokoro': sys.exit('only the fallback voice answered: not the channel voice')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: narration
          path: |
            narr/narration.wav
            narr/narration.json


  plan:
    needs: [cfg, narrate]
    if: always() && needs.cfg.result == 'success' && needs.narrate.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      total: ${{ steps.p.outputs.total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: narration, path: narr, run-id: '${{ needs.cfg.outputs.narr_run }}', github-token: '${{ github.token }}'}
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          STORY: ${{ needs.cfg.outputs.story }}
          RENDER_ENV: 'LOOK=NYC bpy==5.0.0 numpy==1.26.4 ship'   # what the frames job installs and sets; a change renders every shot again
        run: |
          cfg=.github/triggers/data3d_ship
          export SPP=$(sed -n 's/^spp=//p' $cfg) PCT=$(sed -n 's/^pct=//p' $cfg); export SPP=${SPP:-32} PCT=${PCT:-100}
          export REUSE_RUN=$(sed -n 's/^reuse_run=//p' $cfg) RESHOOT="$(sed -n 's/^reshoot=//p' $cfg)" FRESH=$(sed -n 's/^fresh=//p' $cfg)
          export ASSETS_SHA=$(git ls-remote origin refs/heads/data3d-assets | cut -f1)
          NARR="$GITHUB_WORKSPACE/narr/narration.json" python tools/data3d/store/render_plan.py plan

  frames:
    needs: [cfg, plan]
    if: always() && needs.plan.result == 'success'
    name: frames s${{ matrix.shot }} ${{ matrix.part }}/${{ matrix.parts }}${{ matrix.reuse_run != '' && ' (copied)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: narration, path: narr, run-id: '${{ needs.cfg.outputs.narr_run }}', github-token: '${{ github.token }}'}
      - name: Copy an unchanged shot's frames from the run that rendered them (the plan found its key there, or the trigger named reuse_run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.reuse_run != ''
        with: {pattern: '${{ matrix.pattern }}', merge-multiple: true, path: frames, run-id: '${{ matrix.reuse_run }}', github-token: '${{ github.token }}'}
      - name: Deps
        if: matrix.reuse_run == ''
        run: |
          timeout 240 sudo apt-get install -y -q --no-download libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 \
            || timeout 300 sudo apt-get install -y -q libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 || true
          pip install -q bpy==5.0.0 numpy==1.26.4 pillow
          # the real CC0 skies, textures and props (Poly Haven, fetched by data3d_assets.yml to its own branch)
          git fetch -q --depth 1 origin data3d-assets && mkdir -p cache && git archive FETCH_HEAD polyhaven | tar -x -C cache && du -sh cache/polyhaven
      - name: Render this part of the shot
        if: matrix.reuse_run == ''
        env:
          LOOK: NYC
          STAGING: 'on'        # the measured checks report; they stop nothing (daily/ship.py)
          CLIPPING: report
          STORY: ${{ needs.cfg.outputs.story }}
          RESHOOT: ${{ matrix.shot }}     # render_range.py renders only this shot's part of the range
        run: |
          echo "shot ${{ matrix.shot }} part ${{ matrix.part }}/${{ matrix.parts }}: frames ${{ matrix.a }}-${{ matrix.b }} of ${{ needs.plan.outputs.total }} at ${{ matrix.spp }}spp ${{ matrix.pct }}%"
          cd tools/data3d/store
          NARR="$GITHUB_WORKSPACE/narr/narration.json" VBPY=$(which python) python render_range.py ${{ matrix.a }} ${{ matrix.b }} "$GITHUB_WORKSPACE/frames" "${{ matrix.spp }}" "${{ matrix.pct }}" 2>&1 | grep -v "^Fra:"
      - name: Every frame of the range is here (an artifact is only ever a whole part; a later run copies it on that word)
        run: |
          miss=0
          for f in $(seq ${{ matrix.a }} ${{ matrix.b }}); do [ -s "$(printf 'frames/f%04d.png' $f)" ] || { miss=$((miss+1)); echo "missing f$f"; }; done
          extra=$(( $(ls frames/f*.png | wc -l) - ${{ matrix.frames }} ))
          [ "$miss" = 0 ] && [ "$extra" = 0 ] || { echo "::error::shot ${{ matrix.shot }} frames ${{ matrix.a }}-${{ matrix.b }}: $miss missing, $extra outside the range"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: frames/*.png
          retention-days: 3

  assemble:
    needs: [cfg, frames]
    # caaleb 2026-11-12 ("What the fuck were you doing for the past 10 hours"): a judge that re-rolls +-10 a run held
    # the video all night. The video is always assembled once its frames exist; the panel's verdict ships BESIDE it
    # (data3d/proof_verdict.json) so the review sees the scores. Nothing here posts anywhere.
    if: always() && needs.frames.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 1, path: branch}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: main, fetch-depth: 1, path: main}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: art, pattern: 'frames-*'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: narration, path: art/narration, run-id: '${{ needs.cfg.outputs.narr_run }}', github-token: '${{ github.token }}'}
      - name: Deps
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get update -qq && timeout 400 sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config fonts-dejavu-core && break
            sleep 20
          done
          if ! command -v ffmpeg >/dev/null; then
            echo "apt unavailable: using a static ffmpeg build"
            curl -fsSL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo /tmp/ff/bin >> "$GITHUB_PATH"; export PATH=/tmp/ff/bin:$PATH
          fi
          ffmpeg -hide_banner -filters | grep -q subtitles
          pip install -q -r main/data_learning/requirements.txt soundfile || pip install -q matplotlib Pillow numpy requests cairosvg soundfile
      - name: Cache music library
        id: cache-music
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: main/data_learning/music/
          key: music-kmcl-${{ hashFiles('main/scripts/fetch_music.py') }}
          restore-keys: |
            music-kmcl-
      - name: Fetch music if missing
        if: steps.cache-music.outputs.cache-hit != 'true'
        working-directory: main
        run: python3 scripts/fetch_music.py || true
      - name: Assemble
        run: |
          mkdir -p frames out
          cp art/frames-*/*.png frames/
          ls frames | wc -l
          # assemble.py globs the frames, so a missing one would silently shorten the video: every frame or nothing
          want=$(python3 -c "import json,sys;sys.path.insert(0,'branch/tools/data3d');import clock;print(clock.total(json.load(open('art/narration/narration.json'))['windows']))")
          [ "$(ls frames/f*.png | wc -l)" = "$want" ] || { echo "::error::$(ls frames/f*.png | wc -l) frames, the video has $want"; exit 1; }
          python3 branch/tools/data3d/story/assemble.py frames art/narration main out/data3d_short.mp4
          python3 branch/tools/data3d/store/sheet.py frames out/data3d_short_2fps.jpg 8 15
          echo '{"panel": 0, "note": "shipped at the deadline (tools/data3d/daily/ship.py): no panel gated this render"}' > out/proof_verdict.json
          cp branch/tools/data3d/stories/${{ needs.cfg.outputs.story }}/judge_rounds.md out/ 2>/dev/null || true   # every judge round so far, shot by shot (store/rounds.py)
      - name: The showrunner watches the finished cut (a PREVIEW verdict, beside the video; the posting run judges it again)
        continue-on-error: true
        working-directory: main
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from scripts import showrunner_review as sr
          s = json.load(open('../branch/tools/data3d/stories/${{ needs.cfg.outputs.story }}/script.json'))
          ctx = {"slug": s["slug"], "title": s.get("title", ""), "hook": s["lines"][0], "closing": s["lines"][-1],
                 "segments": s["lines"][1:-1], "style_arm": "3d"}
          v = sr.review_video(Path('../out/data3d_short.mp4'), context=ctx)
          Path('../out/showrunner_preview.json').write_text(json.dumps(v, indent=2))
          print("SHOWRUNNER (preview)", v.get("verdict"), v.get("score"), v.get("summary") or v.get("reason"))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: short
          path: out/*
      - name: Push to preview-renders/data3d
        run: |
          cd branch
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q --depth 1 origin preview-renders && git checkout -q -B pr FETCH_HEAD || { git checkout -q --orphan pr; git rm -rqf . ; }
            d=data3d/${{ needs.cfg.outputs.story }}; mkdir -p $d && cp ../out/* $d/ && cp ../art/narration/narration.json $d/
            git add -f data3d && git commit -qm "data3d short ${{ needs.cfg.outputs.story }} $(date -u +%FT%TZ)" && git push -q origin pr:preview-renders && break
            sleep $((i*3))
          done
