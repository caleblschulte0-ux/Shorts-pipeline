name: Auto-merge claude PRs

# Fires on every PR from a claude/* branch and auto-merges it AFTER a
# mechanical sanity gate (audit Ticket 10). The gate is objective-only —
# no human review required, so the pipeline stays autonomous — but it
# stops the obviously-bad merges an unreviewed LLM branch could ship:
# broken workflow YAML, Python that doesn't compile, committed media/
# large binaries, or credential-shaped strings. daily.yml's auto-pause
# remains the runtime safety net.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  sanity:
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mechanical sanity gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          git checkout -q "$HEAD_SHA"
          fail=0
          # 1. Every workflow must parse.
          pip install --quiet pyyaml
          python3 -c "
          import yaml, glob, sys
          for f in glob.glob('.github/workflows/*.yml'):
              try: yaml.safe_load(open(f))
              except Exception as e: print(f'::error file={f}::invalid YAML: {e}'); sys.exit(1)
          print('workflows parse')"
          # 2. Every changed .py must compile.
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")
          echo "$changed" | grep '\.py$' | while read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::does not compile"; exit 1; }
          done
          # 3. No file over 1MB, no committed media/binaries (storage rule).
          #    Compare against BASE_SHA, not just the file's final size: a
          #    file that was ALREADY over 1MB before this PR (an
          #    accumulating text asset like data_learning/niche.config.json,
          #    253 stories and growing by design) is not this PR's doing,
          #    and flagging it blocks EVERY future PR that touches it —
          #    including the routine's own daily explainer authoring. Only
          #    fail on a file that is brand-new over 1MB, or that grew by
          #    more than 300KB in this one diff — the shape of a dropped-in
          #    binary/media blob, not incremental content growth. Found
          #    2026-08-21 when the Routine's own daily PR tripped this on a
          #    niche.config.json that had organically crossed 1MB weeks
          #    earlier with nobody noticing because no PR since had failed
          #    loudly enough to get read.
          for f in $changed; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            base_size=$(git cat-file -s "$BASE_SHA:$f" 2>/dev/null || echo 0)
            growth=$((size - base_size))
            if [ "$size" -gt 1048576 ] && { [ "$base_size" -eq 0 ] || [ "$growth" -gt 307200 ]; }; then
              echo "::error file=$f::${size} bytes, grew ${growth} bytes in this diff — large new content or binary; see docs/STORAGE_AUDIT.md"; fail=1
            fi
            case "$f" in
              *.mp4|*.mov|*.webm|*.mkv|*.wav|*.mp3|*.onnx|*.pt|*.bin)
                echo "::error file=$f::committed media/model binary — use cache/ or artifacts"; fail=1;;
            esac
          done
          # 4. Placement gate (operator ruling 2026-07-30, hard-enforced):
          #    new capability goes UP the funnel — funnel//shared//engines/ —
          #    never into a channel folder, channels never import each other,
          #    and shared modules are never shadowed or copied into a channel.
          python3 scripts/placement_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" || fail=1
          # 4b. CHANNEL POLICY DRIFT. config/channel_registry.json is the only
          #     authority for the slate, the format mix, retired formats and
          #     queue thresholds. This fails if a second copy of any of that
          #     grows back — a constant, a prompt, a doc table. The 2026-07-31
          #     graph-led ruling landed in ONE of five places that stated the
          #     mix, and for weeks the takeover kept asking for a retired
          #     format while every check stayed green.
          python3 -m shared.channel_registry --validate || {
            echo "::error::config/channel_registry.json is invalid"; fail=1; }
          python3 -m unittest tests.test_no_second_source_of_truth -q || {
            echo "::error::a second source of channel policy was introduced"; fail=1; }
          python3 -m unittest tests.test_channel_registry -q || {
            echo "::error::registry contract tests failed"; fail=1; }
          # 5. No credential-shaped additions (private keys, OAuth blobs).
          if git diff "$BASE_SHA" "$HEAD_SHA" -- . ':!*.md' | grep -E '^\+.*(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|"refresh_token"\s*:|AIza[0-9A-Za-z_-]{35})' >/dev/null; then
            echo "::error::diff adds credential-shaped content — refusing to auto-merge"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "sanity gate: PASS"
          exit "$fail"

  # THE TEST SUITE. Until 2026-08-01 this did not exist: 477 tests lived in
  # tests/ and CI ran exactly two of the sixteen files, so `automerge` would
  # squash-merge a PR that broke every other one. A suite that never runs is
  # decoration — it costs the time to write and buys nothing.
  tests:
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          # numpy: data_learning/scenes.py (scripts/test_scene_dispatch.py)
          # ffmpeg: the lookmatch engine self-test refuses to run without it,
          #         which is correct — it measures real video.
          pip install -q pillow pyyaml requests numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # PIPEFAIL OR THE GATE IS DECORATION (doctor 03ed6ae9f195, 2026-08-24).
      # GitHub's default `run:` shell on Linux is `bash -e {0}` — NO pipefail —
      # so `unittest | tail` returned tail's zero and a red suite still
      # squash-merged. The doctor reproduced it: a producer exiting 7 through
      # this exact pipe shape yields step status 0. tests/test_automerge_gate.py
      # now executes a failing producer through this wrapper and requires the
      # nonzero to survive the pipe.
      - name: Full unit suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tail -40
      - name: Split-worker dry run (offline, no Drive, no ChatGPT)
        run: python scripts/exchange_dry_run.py
      - name: Channel-contract acceptance (registry propagation)
        run: python scripts/registry_acceptance.py

      # THE OTHER SUITE. 37 test_*.py files live in scripts/ — an entire
      # second suite outside tests/ that nothing has ever run. 34 of them
      # pass; one had been failing since `overall_10` became a required
      # verdict field, and nobody knew. Two need a full render environment
      # and are skipped by name, honestly, rather than quietly.
      - name: scripts/ suite
        run: |
          set -u
          fail=0
          for f in scripts/test_*.py; do
            case "$(basename "$f")" in
              # Need ffmpeg + a real render; covered by expression-tests.yml.
              test_expressions.py|test_expressions_render.py) continue ;;
            esac
            # PRINT THE FAILURE. A gate that says "something broke" without
            # saying what is a gate people route around.
            if ! out=$(timeout 120 python "$f" 2>&1); then
              echo "::error file=$f::scripts/ test failed"
              echo "$out" | tail -15
              fail=1
            fi
          done
          exit "$fail"

  automerge:
    needs: [sanity, tests]
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash --delete-branch

      # daily.yml is NEVER dispatched from here (doctor finding
      # e524811347c4, 2026-08-23). Before the 2026-07-30 exchange chain,
      # this job used to dispatch daily.yml directly (`gh workflow run`)
      # whenever the PR touched today's trending_packages/ — the note
      # above explained why (GITHUB_TOKEN can't fire workflow_run,
      # workflow_dispatch is the allowed exception). That step survived
      # the exchange migration by accident: exchange_phase_a.yml's own
      # workflow_run trigger on "Auto-merge claude PRs" already covers
      # "kick off the chain after a package merge", and daily.yml itself
      # now only renders on Phase B completing successfully (or an
      # explicit human override). Leaving the old step in place meant a
      # package merge could reach daily.yml via workflow_dispatch — which
      # is NOT gated on Phase B — hours before ChatGPT's media/editorial
      # pass ever ran. That is exactly what happened on 2026-08-21: the
      # package merge landed at 09:31:56 UTC, Daily rendered by 09:48:07
      # UTC, and the exchange (media worker 11:02:13, finalizer 12:08:53,
      # Phase B applied 14:06:59) did not finish until hours later —
      # trending shipped 3/6 with both Reddit packages blocked for
      # inadequate media, media the exchange had by then fully supplied.
      # See CLAUDE.md's EXCHANGE PIPELINE section and
      # docs/EXCHANGE_PIPELINE.md for the intended order:
      # Phase A -> ChatGPT -> DONE -> Phase B -> daily.yml.
