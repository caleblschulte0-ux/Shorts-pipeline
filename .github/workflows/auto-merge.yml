name: Auto-merge claude PRs

# Fires on every PR from a claude/* branch and auto-merges it AFTER a
# mechanical sanity gate (audit Ticket 10). The gate is objective-only —
# no human review required, so the pipeline stays autonomous — but it
# stops the obviously-bad merges an unreviewed LLM branch could ship:
# broken workflow YAML, Python that doesn't compile, committed media/
# large binaries, or credential-shaped strings. daily.yml's auto-pause
# remains the runtime safety net.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write   # needed for `gh workflow run` to dispatch daily.yml

jobs:
  sanity:
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mechanical sanity gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          git checkout -q "$HEAD_SHA"
          fail=0
          # 1. Every workflow must parse.
          pip install --quiet pyyaml
          python3 -c "
          import yaml, glob, sys
          for f in glob.glob('.github/workflows/*.yml'):
              try: yaml.safe_load(open(f))
              except Exception as e: print(f'::error file={f}::invalid YAML: {e}'); sys.exit(1)
          print('workflows parse')"
          # 2. Every changed .py must compile.
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")
          echo "$changed" | grep '\.py$' | while read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::does not compile"; exit 1; }
          done
          # 3. No file over 1MB, no committed media/binaries (storage rule).
          for f in $changed; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error file=$f::${size} bytes — files >1MB never belong in git (see docs/STORAGE_AUDIT.md)"; fail=1
            fi
            case "$f" in
              *.mp4|*.mov|*.webm|*.mkv|*.wav|*.mp3|*.onnx|*.pt|*.bin)
                echo "::error file=$f::committed media/model binary — use cache/ or artifacts"; fail=1;;
            esac
          done
          # 4. Placement gate (operator ruling 2026-07-30, hard-enforced):
          #    new capability goes UP the funnel — funnel//shared//engines/ —
          #    never into a channel folder, channels never import each other,
          #    and shared modules are never shadowed or copied into a channel.
          python3 scripts/placement_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" || fail=1
          # 4b. CHANNEL POLICY DRIFT. config/channel_registry.json is the only
          #     authority for the slate, the format mix, retired formats and
          #     queue thresholds. This fails if a second copy of any of that
          #     grows back — a constant, a prompt, a doc table. The 2026-07-31
          #     graph-led ruling landed in ONE of five places that stated the
          #     mix, and for weeks the reserve bank banked a retired format
          #     while every check stayed green.
          python3 -m shared.channel_registry --validate || {
            echo "::error::config/channel_registry.json is invalid"; fail=1; }
          python3 -m unittest tests.test_no_second_source_of_truth -q || {
            echo "::error::a second source of channel policy was introduced"; fail=1; }
          python3 -m unittest tests.test_channel_registry -q || {
            echo "::error::registry contract tests failed"; fail=1; }
          # 5. No credential-shaped additions (private keys, OAuth blobs).
          if git diff "$BASE_SHA" "$HEAD_SHA" -- . ':!*.md' | grep -E '^\+.*(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|"refresh_token"\s*:|AIza[0-9A-Za-z_-]{35})' >/dev/null; then
            echo "::error::diff adds credential-shaped content — refusing to auto-merge"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "sanity gate: PASS"
          exit "$fail"

  # THE TEST SUITE. Until 2026-08-01 this did not exist: 477 tests lived in
  # tests/ and CI ran exactly two of the sixteen files, so `automerge` would
  # squash-merge a PR that broke every other one. A suite that never runs is
  # decoration — it costs the time to write and buys nothing.
  tests:
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install -q pillow pyyaml requests
      - name: Full unit suite
        run: python -m unittest discover -s tests -v 2>&1 | tail -40
      - name: Split-worker dry run (offline, no Drive, no ChatGPT)
        run: python scripts/exchange_dry_run.py
      - name: Channel-contract acceptance (registry propagation)
        run: python scripts/registry_acceptance.py

  automerge:
    needs: [sanity, tests]
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash --delete-branch

      # If the PR touched today's package directory, manually kick off
      # daily.yml. We can't rely on the workflow_run cascade or the
      # push-paths trigger — both are dead-ended by GitHub's "workflows
      # can't trigger other workflows from GITHUB_TOKEN" anti-recursion
      # rule. workflow_dispatch is the explicitly-allowed exception:
      # it's the one event GITHUB_TOKEN CAN fire.
      - name: Trigger daily.yml if the PR added today's packages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # List files the PR changed.
          files=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json files --jq '.files[].path')
          echo "Changed files:"
          printf '  %s\n' $files
          today=$(date -u +%Y%m%d)
          if echo "$files" | grep -q "^state/trending_packages/${today}/"; then
            echo "Today's packages were touched — firing daily.yml."
            gh workflow run daily.yml \
              --repo "${{ github.repository }}" \
              --ref main
          else
            echo "No package changes for today (${today}); skipping daily dispatch."
          fi
