name: Credential heartbeat

# WHICH KEY IS DEAD, AND ONLY WHEN IT IS.
#
# Every other preflight in this repo checks whether a credential is SET, and a
# revoked key is a non-empty string — so it passes them all and dies at the
# moment it is needed. On 2026-09-07 `GROQ_API_KEY` was present, the workflow
# was green, and three trending slots died on the one call that mattered.
#
# This alerts on a CHANGE to dead, never on the standing state. A daily alarm
# for a key you already know about is how somebody learns to ignore the one
# that will eventually say something new — the same reasoning daily.yml uses
# for its phase_b_incomplete skip.

on:
  schedule:
    # 13:10 UTC — after the day's authoring and before the first post, so a
    # dead key is known while there is still time to replace it.
    - cron: "10 13 * * *"
  workflow_dispatch:

concurrency:
  group: credentials
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  REPORT_ISSUE_NUMBER: ${{ vars.REPORT_ISSUE_NUMBER || '1' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The subscription token is not an API key and has no cheap HTTP probe,
      # so the CLI has to be here for that one row to mean anything. Without
      # it the probe reports "unreachable", never "dead" — sending somebody to
      # mint a credential that is fine is worse than saying nothing.
      - name: Install the Claude CLI (for the subscription probe)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true

      - name: Probe every credential
        id: probe
        continue-on-error: true          # a dead key is a REPORT, not a broken run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_EXPLAINER: ${{ secrets.YOUTUBE_TOKEN_JSON_EXPLAINER }}
          YOUTUBE_TOKEN_JSON_THIRD: ${{ secrets.YOUTUBE_TOKEN_JSON_THIRD }}
          YOUTUBE_TOKEN_JSON_CURIOSITY: ${{ secrets.YOUTUBE_TOKEN_JSON_CURIOSITY }}
        run: |
          python3 scripts/credential_check.py | tee /tmp/creds.txt
          echo "newly_dead=$(python3 -c "
          import json
          print(','.join(json.load(open('state/credentials.json'))['newly_dead']))
          ")" >> $GITHUB_OUTPUT

      # The record is what makes "alert on a change" possible at all, so it is
      # committed whatever the verdict was.
      - name: Record the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/credentials.json
          git diff --cached --quiet || git commit -m "credentials: heartbeat [skip ci]"
          git push || echo "::warning::could not push the credential record"

      - name: Say so, once, when a key has just died
        if: steps.probe.outputs.newly_dead != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NEWLY_DEAD: ${{ steps.probe.outputs.newly_dead }}
        run: |
          MSG="CREDENTIAL DEAD: $NEWLY_DEAD — needs replacing. Everything else is fine; this fires only on the day a key stops working, not while it stays broken."
          # Built in a file rather than inline: the report is a fenced block
          # and a fence at column 0 inside a YAML run block ends the scalar.
          {
            echo "$MSG"
            echo
            printf '```\n'
            cat /tmp/creds.txt
            printf '```\n'
          } > /tmp/creds_comment.md
          gh issue comment "$REPORT_ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/creds_comment.md \
            || echo "::warning::could not comment on issue $REPORT_ISSUE_NUMBER"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" \
                 -H "Title: Credential dead" -H "Tags: key" || true
          fi
