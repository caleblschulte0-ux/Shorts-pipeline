# Voice lab round 8: real people who sound like Voice 24 and Voice 11 (no blending).
# No secrets; read-only token; only collect writes, and only to this branch.
name: Voice lab similar
on:
  push:
    branches: [voice-lab]
    paths: ['voice_lab/similar_refs.py', 'voice_lab/gen_sim.py', '.github/workflows/voice_lab_similar.yml']
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          mkdir globe
          B=https://huggingface.co/datasets/MushanW/GLOBE_V2/resolve/main/data
          for f in test-00000-of-00002 test-00001-of-00002 val-00000-of-00002 val-00001-of-00002; do
            curl -fsSL -o globe/$f.parquet $B/$f.parquet
          done
          for n in $(seq 0 39); do
            f=train-$(printf %05d $n)-of-00164
            curl -fsSL -o globe/$f.parquet $B/$f.parquet
          done
          df -h . | tail -1
          sha256sum globe/* | tee globe.sha256
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q soundfile numpy librosa pyarrow speechbrain==1.0.3 "huggingface_hub<0.26"
          python voice_lab/similar_refs.py globe out voice_lab
          cp globe.sha256 out/
      - uses: actions/upload-artifact@v4
        with: { name: sim_refs, path: out/ }
  gen:
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: ['full 0/4', 'full 1/4', 'full 2/4', 'full 3/4', 'turbo 0/2', 'turbo 1/2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { name: sim_refs, path: refs/ }
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 --extra-index-url https://download.pytorch.org/whl/cpu
          set -- ${{ matrix.job }}
          python voice_lab/gen_sim.py refs out $1 $2
      - id: n
        run: echo "n=$(echo '${{ matrix.job }}' | tr ' /' '__')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'sim_${{ steps.n.outputs.n }}', path: out/ }
  collect:
    needs: [refs, gen]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { path: dl/ }
      - run: |
          mkdir -p voice_lab/sim
          find dl -type f \( -name '*.mp3' -o -name '*.txt' -o -name '*.json' -o -name '*.sha256' \) -exec cp {} voice_lab/sim/ \;
          find dl -name 'sim_*.wav' -exec sh -c 'ffmpeg -y -loglevel error -i "$1" -ac 1 -c:a libopus -b:a 96k voice_lab/sim/$(basename "$1" .wav).ogg' _ {} \;
          pip install -q openai-whisper
          python voice_lab/heard_young.py voice_lab/sim || true
          git config user.name "voice-lab"
          git config user.email "voice-lab@users.noreply.github.com"
          git add -f voice_lab/sim
          git commit -m "voice lab similar results [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin voice-lab && git push origin HEAD:voice-lab && break; sleep $((i*3)); done
