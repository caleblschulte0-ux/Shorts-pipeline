name: Study clippers

# What a clip channel the audience already rewards actually posts
# (operator, 2026-10-18: "does this thing know what a good clip is? ...
# go watch, like, Stable Ronaldo"). scripts/study_clippers.py lists every
# short on each channel, then fetches, transcribes and contact-sheets its
# best and worst. Results go to `preview-renders:study/<run_id>/`.
#
# Manual only. No YouTube upload credential is present, so it cannot
# publish. A brain is called only with `judge`: our story critic scores
# each studied short, to see whether its number tracks real views.

on:
  workflow_dispatch:
    inputs:
      channels:
        description: 'Comma-separated @handles or UC... channel ids'
        required: false
        default: ''
      search:
        description: 'Also study the most-viewed shorts anyone posted for these words (comma-separated)'
        required: false
        default: 'stable ronaldo'
      top:
        description: 'Best shorts to study per channel'
        required: false
        default: '10'
      bottom:
        description: 'Worst (mature) shorts to study per channel'
        required: false
        default: '4'
      ids:
        description: 'Also study these video ids as known losers (comma-separated, e.g. our worst posts)'
        required: false
        default: ''
      judge:
        description: 'Also run our story critic on each studied short (uses the Claude subscription)'
        type: boolean
        required: false
        default: false
      probe:
        description: 'Instead: probe the free video routes (loader.to page, Dailymotion) for the first id and search words, log only'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # push the study to preview-renders

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: study-clippers
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core

      - name: Install python deps
        run: |
          pip install -q pillow numpy yt-dlp curl_cffi openai-whisper playwright
          python -m playwright install --with-deps chromium >/dev/null || echo "::warning::playwright chromium install failed"

      - name: Install Claude CLI (the critic, only when judging)
        if: inputs.judge
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || echo "::warning::claude-code install failed"

      - name: Study
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          THIRD_ASR: groq
          CHANNELS: ${{ inputs.channels }}
          SEARCH: ${{ inputs.search }}
          IDS: ${{ inputs.ids }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.judge && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          GEMINI_API_KEY: ${{ inputs.judge && secrets.GEMINI_API_KEY || '' }}
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scripts/yt_probe.py "${IDS%%,*}" "${SEARCH%%,*}"; exit 0
          fi
          python scripts/study_clippers.py --out study --channels "$CHANNELS" --search "$SEARCH" --ids "$IDS" \
            --top "${{ inputs.top || '10' }}" --bottom "${{ inputs.bottom || '4' }}" \
            ${{ inputs.judge && '--judge' || '' }}

      - name: Publish to the preview-renders orphan branch
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          cp study/index.json study/*.jpg "$RUNNER_TEMP/payload/" 2>/dev/null || true
          dest="study/${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf study
          # ADD to the branch, never replace it (backtest-preview.yml)
          git fetch origin preview-renders --depth=1 || true
          if git checkout -B preview-renders origin/preview-renders 2>/dev/null; then
            :
          else
            git checkout --orphan preview-renders
            git rm -rq --cached . 2>/dev/null || true
            git clean -fdq 2>/dev/null || true
          fi
          mkdir -p "$dest"
          cp -r "$RUNNER_TEMP/payload/." "$dest/"
          git add -f "$dest"
          git commit -m "clipper study ${{ github.run_id }}" \
            || { echo "nothing new to commit"; exit 0; }
          for i in 1 2 3 4; do
            git push origin preview-renders && break
            git pull --rebase origin preview-renders || true
            sleep $((i * 2))
          done
          echo "published -> preview-renders:$dest"
