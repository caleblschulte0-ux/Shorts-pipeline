name: Sports hotfix trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sports-hotfix-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patched Sports workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sports.yml --ref main
